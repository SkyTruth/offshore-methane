<title>Nightly Offshore Flaring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a night-watch console. Map fills the left; a ranked readout panel on the
   right; stacks to map-then-panel on phones. Single deliberate dark world: flares
   glow on one amber ramp over a night ocean. */
:root {
  color-scheme: dark;
  --night: #091017;
  --sea: #0b141c;
  --land: #17212b;
  --coast: #2a3744;
  --panel: #0e1821;
  --raise: #132130;
  --rule: #1e2c39;
  --ink: #e3e9ee;
  --ink-2: #9aa8b4;
  --ink-3: #66747f;
  --flare-1: #5e2b10;
  --flare-2: #923f13;
  --flare-3: #c95d18;
  --flare-4: #f28d27;
  --flare-5: #ffbc5f;
  --flare-6: #ffe4b0;
  --clear: #4a6a80;
  --cloud: #3a4753;
  --focus: #7ad5e9;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--display);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.brand { min-width: 0; }
h1 {
  margin: 0;
  font-stretch: 72%;
  font-weight: 760;
  font-size: 26px;
  letter-spacing: 0.01em;
  line-height: 1.1;
  text-wrap: balance;
}
h1 .glow { color: var(--flare-5); text-shadow: 0 0 18px rgba(242, 141, 39, 0.45); }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.sub b { color: var(--ink); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button {
  border: 0;
  background: transparent;
  padding: 6px 10px;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  border-right: 1px solid var(--rule);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--raise); }
.seg button[aria-pressed="true"] { color: var(--night); background: var(--flare-5); font-weight: 650; }
.seg .wk { color: inherit; opacity: 0.7; margin-right: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.player {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 3px 10px 3px 3px;
}
.player button {
  border: 0; border-radius: 6px; background: var(--flare-4); color: var(--night); font-weight: 650;
  padding: 4px 10px; cursor: pointer; font-size: 12.5px; min-width: 78px; text-align: left;
}
.player button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.player input { width: 120px; max-width: 30vw; accent-color: var(--flare-4); margin: 0; }
.clock {
  position: absolute; left: 10px; top: 10px; pointer-events: none;
  background: rgba(9, 16, 23, 0.78); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 11px 7px;
}
.clock .d { font-stretch: 75%; font-weight: 760; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.clock .s { font-size: 11px; color: var(--ink-2); }
.pct {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel);
  padding: 4px 10px; font-size: 12.5px; color: var(--ink-2);
}
.pct input { width: 150px; max-width: 40vw; accent-color: var(--flare-4); margin: 0; }
.pct output { font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 21ch; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; }
.mapwrap { position: relative; min-height: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sea); }
#map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.legend {
  position: absolute; left: 10px; bottom: 10px;
  background: rgba(9, 16, 23, 0.86); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 10px; display: grid; gap: 6px; font-size: 11.5px; color: var(--ink-2);
  max-width: calc(100% - 20px);
}
.legend .lt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.legend .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { display: block; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button {
  min-width: 34px; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--rule);
  background: rgba(9, 16, 23, 0.86); color: var(--ink); cursor: pointer; font-size: 13px;
}
.zoomctl button:hover { border-color: var(--ink-3); }
.tip {
  position: absolute; z-index: 5; pointer-events: none; width: 252px;
  background: rgba(10, 18, 26, 0.96); border: 1px solid var(--coast); border-radius: 9px;
  padding: 10px 11px 9px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}
.tip .v { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .u { font-size: 11.5px; color: var(--ink-2); margin-left: 4px; }
.tip .nm { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.tip .nm b { color: var(--ink); font-weight: 600; }
.tip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.tip dt { color: var(--ink-3); }
.tip dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .hint { margin-top: 6px; font-size: 11px; color: var(--ink-3); }

.panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.panel > * { flex-shrink: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 13px; min-width: 0; }
h2 {
  margin: 0 0 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2);
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
h2 .aside { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); font-size: 11.5px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--panel); padding: 10px 12px; min-width: 0; }
.tile .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.tile .num { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile .num small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 3px; }
.tile .ctx { font-size: 11.5px; color: var(--ink-2); }

ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol.rank button {
  width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) 72px 82px; align-items: center; gap: 8px;
  border: 0; border-radius: 6px; background: transparent; padding: 5px 6px; cursor: pointer; text-align: left;
}
ol.rank button:hover, ol.rank button.on { background: var(--raise); }
ol.rank .i { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .n { min-width: 0; }
ol.rank .n b { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .n span { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .val { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .val small { display: block; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 5px 6px; border-bottom: 1px solid var(--rule); text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--display); font-size: 12.5px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raise); }
tr.click:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

.detail-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.detail-head h3 { margin: 0; font-size: 16px; font-stretch: 85%; font-weight: 700; }
.detail-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.close { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.facts div { min-width: 0; }
.facts .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.facts .num { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.note b { color: var(--ink); font-weight: 600; }
.chartkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.chartkey span { display: inline-flex; align-items: center; gap: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; }
a { color: var(--focus); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.copy { border: 1px solid var(--rule); background: transparent; color: var(--ink-2); border-radius: 5px; padding: 0 6px; cursor: pointer; font-size: 11px; }

.val-grid { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--flare-4); border-radius: 4px; }
.bar .pct { font-family: var(--mono); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .pct small { color: var(--ink-3); }

details.card summary { cursor: pointer; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); }
details.card ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; display: grid; gap: 5px; }
details.card li b { color: var(--ink); font-weight: 600; }
.foot { font-size: 11.5px; color: var(--ink-3); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; }
  .mapwrap { height: 62vh; min-height: 340px; }
  .panel { overflow: visible; }
  h1 { font-size: 22px; }
}
@media (max-width: 420px) {
  .facts { grid-template-columns: 1fr 1fr; }
  ol.rank button { grid-template-columns: 20px minmax(0, 1fr) 82px; }
  ol.rank .spark { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="brand">
    <h1>Nightly Offshore <span class="glow">Flaring</span></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="controls">
    <div class="player">
      <button type="button" id="play" aria-pressed="false">▶ Play</button>
      <input type="range" id="scrub" min="0" max="6" step="0.01" value="0" aria-label="Night timeline">
    </div>
    <div class="seg" role="group" aria-label="Night shown" id="nights"></div>
    <div class="seg" role="group" aria-label="Sites shown">
      <button type="button" id="show-all" aria-pressed="true">All sites</button>
      <button type="button" id="show-flaring" aria-pressed="false">Flaring only</button>
    </div>
    <label class="pct" for="pct">Hide below
      <input type="range" id="pct" min="0" max="100" step="1" value="0" aria-describedby="pct-out">
      <output id="pct-out" for="pct"></output>
    </label>
  </div>
</header>

<main class="app">
  <section class="mapwrap" id="mapwrap">
    <canvas id="map" role="img" aria-label="Map of offshore oil sites coloured by flare radiant heat"></canvas>
    <div class="zoomctl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset">World</button>
    </div>
    <div class="clock" id="clock" aria-live="polite"></div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <aside class="panel" aria-label="Flaring summary">
    <div class="tiles" id="tiles"></div>

    <section class="card" id="detail" hidden></section>

    <section class="card">
      <h2>Strongest flares <span class="aside" id="rank-aside"></span></h2>
      <ol class="rank" id="rank"></ol>
    </section>

    <section class="card">
      <h2>By region <span class="aside">click to zoom</span></h2>
      <div class="tbl-wrap"><table id="regions"></table></div>
    </section>

    <section class="card">
      <h2>Against EOG's 2025 catalog</h2>
      <div id="validation"></div>
    </section>

    <details class="card">
      <summary>Method and caveats</summary>
      <ul id="method"></ul>
    </details>

    <p class="foot" id="foot"></p>
  </aside>
</main>

<script type="application/json" id="flaring-data">__FLARING_DATA__</script>
<script type="application/json" id="basemap">__BASEMAP_TOPOJSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("flaring-data").textContent);
  const TOPO = JSON.parse(document.getElementById("basemap").textContent);
  const META = D.meta, NIGHTS = D.nights, NN = NIGHTS.length, SLOPE = META.bcm_per_mw_year;
  const CSS = getComputedStyle(document.documentElement);
  const C = {};
  ["sea", "land", "coast", "clear", "cloud", "focus", "ink", "ink-2", "ink-3", "rule", "raise",
   "flare-1", "flare-2", "flare-3", "flare-4", "flare-5", "flare-6"].forEach(k => {
    C[k] = CSS.getPropertyValue("--" + k).trim();
  });
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SVGNS = "http://www.w3.org/2000/svg";

  // ---------- data ----------
  const S = D.sites.map(r => ({
    id: r[0], lat: r[1], lon: r[2], nstruct: r[3], st: r[4], rh: r[5], tmax: r[6], mean: r[7],
    region: r[8], mycRegime: r[9], mycBcm: r[10], mycIso: r[11], mycClass: r[12], structs: r[13],
  }));
  const count = (s, set) => { let n = 0; for (const ch of s) if (set.includes(ch)) n++; return n; };
  S.forEach(s => {
    s.nFlare = count(s.st, "F");
    s.nClear = count(s.st, "FC");
    s.nObs = count(s.st, "FCK");
    s.name = s.region + (s.mycIso ? " · " + s.mycIso : "");
  });
  const BY_ID = new Map(S.map(s => [s.id, s]));

  const state = { night: -1, flaringOnly: false, selected: null, hover: null, hl: null, pct: 0, thr: null, nFl: 0, animT: null };

  // Animation frame at fractional night t: ease between adjacent nights' values.
  // Cloudy or unobserved nights hold the neighbouring clear value at low opacity.
  const nightVal = (s, n) => s.st[n] === "F" ? s.rh[n] : s.st[n] === "C" ? 0 : null;
  function frameValue(s, t) {
    const tt = Math.max(0, Math.min(t, NN - 1));
    const i = Math.floor(tt), j = Math.min(i + 1, NN - 1), f = tt - i, k = Math.round(tt);
    let a = nightVal(s, i), b = nightVal(s, j);
    if (a == null && b == null) return { st: s.st[k], v: null, alpha: 1 };
    if (a == null) a = b;
    if (b == null) b = a;
    const e = reduceMotion ? (f < 0.5 ? 0 : 1) : f * f * (3 - 2 * f);
    const known = s.st[k] === "F" || s.st[k] === "C";
    return { st: s.st[k], v: a + (b - a) * e, alpha: known ? 1 : 0.32 };
  }

  function statusOf(s) {
    if (state.night < 0) return s.nFlare ? "F" : s.nClear ? "C" : s.nObs ? "K" : "N";
    return s.st[state.night];
  }
  function valueOf(s) {
    if (state.night < 0) return s.nFlare ? s.mean : null;
    return s.st[state.night] === "F" ? s.rh[state.night] : null;
  }
  // Percentile cut over flaring sites in the current view (mean or one night).
  function computeThreshold() {
    const vals = S.filter(s => statusOf(s) === "F").map(valueOf).sort(d3.ascending);
    state.nFl = vals.length;
    state.thr = state.pct > 0 && vals.length ? d3.quantileSorted(vals, state.pct / 100) : null;
  }
  function visible(s) {
    const st = statusOf(s);
    if (st === "N") return false;
    if (state.flaringOnly && st !== "F") return false;
    if (state.thr != null) return st === "F" && valueOf(s) >= state.thr;
    return true;
  }

  // ---------- formatting ----------
  const fmtMW = v => v == null ? "–" : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
  const fmtInt = d3.format(",");
  const mcm = mw => mw * SLOPE * 1000; // million m3 per year
  const fmtMcm = v => v >= 100 ? d3.format(",.0f")(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  const dayLabel = (iso, withMonth) => {
    const d = new Date(iso + "T00:00:00Z");
    const wd = d.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
    const md = d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
    return withMonth ? [wd, md] : [wd, String(d.getUTCDate())];
  };
  const rangeText = () => {
    const a = new Date(NIGHTS[0] + "T00:00:00Z"), b = new Date(NIGHTS[NN - 1] + "T00:00:00Z");
    const o = { month: "short", day: "numeric", timeZone: "UTC" };
    return a.toLocaleDateString("en-US", o) + " – " + b.toLocaleDateString("en-US", { ...o, year: "numeric" });
  };
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) e.append(k);
    return e;
  }
  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }

  // ---------- colour & size ----------
  const ramp = d3.interpolateRgbBasis([C["flare-2"], C["flare-3"], C["flare-4"], C["flare-5"], C["flare-6"]]);
  const tScale = d3.scaleLog().domain([0.05, 60]).range([0, 1]).clamp(true);
  const colorOf = v => ramp(tScale(Math.max(v, 0.05)));
  const radiusOf = v => Math.min(2.4 + 2.3 * Math.sqrt(Math.max(v, 0)), 22);

  // ---------- header & controls ----------
  document.getElementById("sub").append(
    "VIIRS night passes over ", el("b", { text: fmtInt(META.n_sites) }), " GFW offshore oil sites · ",
    el("b", { text: rangeText() }), " · one value per site per night");

  const nightBox = document.getElementById("nights");
  const nightBtns = [];
  const mkNight = (i, label) => {
    const b = el("button", { type: "button", "aria-pressed": String(i === state.night) });
    if (Array.isArray(label)) b.append(el("span", { class: "wk", text: label[0] }), label[1]); else b.append(label);
    b.addEventListener("click", () => { pause(); state.animT = null; state.night = i; refresh(); });
    nightBtns.push([i, b]);
    nightBox.append(b);
  };
  mkNight(-1, NN + "-night mean");
  NIGHTS.forEach((n, i) => mkNight(i, dayLabel(n, false)));

    const bounds = new Map(D.regions.map(r => [r[0], r.slice(1)]));
    t.append(el("thead", null, el("tr", null, el("th", { text: "Region" }), el("th", { text: "Flaring" }), el("th", { text: "MW" }), el("th", { text: "BCM/yr" }))));
    const tb = el("tbody");
    for (const [name, [n, mw]] of groups) {
      const tr = el("tr", { class: bounds.has(name) ? "click" : "", tabindex: bounds.has(name) ? "0" : "-1" },
        el("td", { text: name }), el("td", { text: fmtInt(n) }), el("td", { text: fmtMW(mw) }), el("td", { text: (mw * SLOPE).toFixed(3) }));
      const zoomTo = () => {
        const b = bounds.get(name); if (!b) return;
        const p0 = proj([b[0], b[3]]), p1 = proj([b[2], b[1]]);
        go(fit(p0[0], p0[1], p1[0], p1[1], 0.04));
      };
      tr.addEventListener("click", zoomTo);
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); zoomTo(); } });
      tb.append(tr);
    }
    t.append(tb);
  }

  // ---------- legend ----------
  function renderLegend() {
    const lg = document.getElementById("legend");
    lg.replaceChildren();
    lg.append(el("div", { class: "lt", text: state.night < 0 ? "Mean radiant heat (MW)" : "Radiant heat (MW)" }));
    const row = el("div", { class: "row" });
    [0.2, 2, 20, 60].forEach(v => {
      const r = radiusOf(v), s = svg("svg", { width: 2 * r + 4, height: 2 * r + 4 });
      s.append(svg("circle", { cx: r + 2, cy: r + 2, r, fill: colorOf(v), stroke: "rgba(9,16,23,0.9)", "stroke-width": 1.5 }));
      row.append(el("span", { class: "k" }, s, fmtMW(v)));
    });
    lg.append(row);
    const row2 = el("div", { class: "row" });
    const dotK = c => { const s = svg("svg", { width: 8, height: 8 }); s.append(svg("circle", { cx: 4, cy: 4, r: 2.6, fill: c })); return s; };
    row2.append(el("span", { class: "k" }, dotK(C.clear), "clear, no flare"), el("span", { class: "k" }, dotK(C.cloud), "cloudy every pass"));
    lg.append(row2);
  }

  // ---------- validation & method ----------
  function renderValidation() {
    const v = META.validation, box = document.getElementById("validation");
    box.append(el("p", { class: "note" }, el("b", { text: fmtInt(v.matched) }), " of " + fmtInt(v.observed) +
      " oil sites seen in clear sky this week sit within 1 km of an EOG upstream flare from 2025. Share flagged flaring on at least one night, by EOG's 2025 persistence class:"));
    const grid = el("div", { class: "val-grid" });
    ["persistent", "intermittent", "sporadic", "undetected", "insufficient_observations"].forEach(k => {
      if (!v.by_regime[k]) return;
      const [hit, n] = v.by_regime[k], pct = n ? hit / n : 0;
      grid.append(el("div", { class: "bar" }, el("span", { text: k.replace("_", " ") }),
        el("span", { class: "track" }, el("span", { class: "fill", style: "display:block;width:" + (pct * 100).toFixed(1) + "%" })),
        el("span", { class: "pct" }, (pct * 100).toFixed(0) + "% ", el("small", { text: hit + "/" + n }))));
    });
    box.append(grid);
    const p = el("p", { class: "note" });
    if (v.log_r != null) p.append("Annualised volume vs EOG 2025, log-log r = ", el("b", { text: v.log_r.toFixed(2) }), " (n = " + v.n_both + "). ");
    p.append(el("b", { text: fmtInt(v.unmatched_flaring) }), " flaring sites have no EOG 2025 flare within 1 km.");
    box.append(p);
  }
  function renderMethod() {
    const ul = document.getElementById("method");
    const li = (b, t) => ul.append(el("li", null, el("b", { text: b }), " " + t));
    li("Detection.", "M10 (1.6 µm) above its aggregation-zone mean + 4σ within 2 pixels of a site, confirmed in M11, M12 or M13; single-curve Planck fit for temperature and source area (after Elvidge et al. 2013, 2019).");
    li("Value.", "Radiant heat sums the brightest pixel's scan neighbours above 75% of its heat. A night's value is the mean over clear passes, counting clear passes with no detection as 0.");
    li("Gas volume.", "Annualised with EOG's John Zink calibration, " + SLOPE + " BCM/yr per MW (MYC25Q4). Single nights are noisy; read volumes as rough rates.");
    li("Clear sky.", "NOAA enterprise cloud mask at the site pixel (clear or probably clear), solar zenith ≥ 97°. A detection counts as clear.");
    li("Satellites.", "SNPP " + fmtInt(META.by_satellite.SNPP) + ", NOAA-20 " + fmtInt(META.by_satellite["NOAA-20"]) + ", NOAA-21 " + fmtInt(META.by_satellite["NOAA-21"]) + " site passes. SNPP delivered no data after 2 Nov 15:32 UTC.");
    li("Sites.", "GFW fixed infrastructure labelled oil and active in the latest month, merged within 750 m (" + fmtInt(META.n_structures) + " structures → " + fmtInt(META.n_sites) + " sites). Region names come from bounding boxes; country codes from the matched EOG flare.");
    li("Not yet modelled.", "Spectral response, dual-curve background fit, atmospheric correction, cross-satellite calibration, glow filtering and isolated-cloud clearing.");
  }
  document.getElementById("foot").textContent =
    "NOAA VIIRS SDRs (NOAA Open Data Dissemination), " + fmtInt(META.granules) + " granules / " + META.gb + " GB read. " +
    "GFW fixed infrastructure. EOG MYC25Q4 (CC BY-NC 4.0). Generated " + META.generated + ".";

  // ---------- zoom buttons ----------
  document.getElementById("zin").addEventListener("click", () => csel.transition().duration(reduceMotion ? 0 : 300).call(zoom.scaleBy, 2));
  document.getElementById("zout").addEventListener("click", () => csel.transition().duration(reduceMotion ? 0 : 300).call(zoom.scaleBy, 0.5));
  document.getElementById("zreset").addEventListener("click", () => go(worldView()));

  const pctIn = document.getElementById("pct"), pctOut = document.getElementById("pct-out");
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  pctIn.addEventListener("input", () => { state.pct = Number(pctIn.value); refresh(); });
  function renderPct() {
    if (state.thr == null) { pctOut.textContent = "off · all sites"; return; }
    const shown = S.filter(s => statusOf(s) === "F" && visible(s)).length;
    pctOut.textContent = ordinal(state.pct) + " pct · ≥ " + fmtMW(state.thr) + " MW · " + fmtInt(shown) + " sites";
  }

  // ---------- night animation ----------
  const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub");
  const clock = document.getElementById("clock");
  scrub.max = String(NN - 1);
  const MS_PER_NIGHT = 1500, END_HOLD = 0.6;
  let raf = null, lastTs = null, stepAcc = 0;
  function updateClock() {
    clock.replaceChildren();
    if (state.night < 0 && state.animT == null) {
      clock.append(el("div", { class: "d", text: NN + "-night mean" }), el("div", { class: "s", text: "clear-sky mean per site" }));
      return;
    }
    const k = Math.max(0, state.night), [wd, md] = dayLabel(NIGHTS[k], true);
    clock.append(el("div", { class: "d", text: wd + " " + md }),
      el("div", { class: "s", text: "night " + (k + 1) + " of " + NN + " · passes near 01:30 local" }));
  }
  function setFrame(t) {
    state.animT = t;
    const k = Math.min(NN - 1, Math.round(Math.min(t, NN - 1)));
    scrub.value = String(Math.min(t, NN - 1));
    if (k !== state.night) { state.night = k; refreshPanels(); }
    updateClock();
    draw();
  }
  function tick(ts) {
    const dt = lastTs == null ? 0 : Math.min(ts - lastTs, 100);
    lastTs = ts;
    let t = state.animT;
    if (reduceMotion) {
      stepAcc += dt;
      if (stepAcc >= MS_PER_NIGHT) { stepAcc = 0; t = Math.floor(t) + 1; }
    } else t += dt / MS_PER_NIGHT;
    if (t > NN - 1 + END_HOLD) t = 0;
    setFrame(t);
    raf = requestAnimationFrame(tick);
  }
  function play() {
    if (raf) return;
    if (state.animT == null || state.animT >= NN - 1) state.animT = state.night >= 0 && state.night < NN - 1 ? state.night : 0;
    lastTs = null; stepAcc = 0;
    playBtn.setAttribute("aria-pressed", "true"); playBtn.textContent = "❚❚ Pause";
    setFrame(state.animT);
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    playBtn.setAttribute("aria-pressed", "false"); playBtn.textContent = "▶ Play";
  }
  playBtn.addEventListener("click", () => (raf ? pause() : play()));
  scrub.addEventListener("input", () => { pause(); setFrame(Number(scrub.value)); });

  function refreshPanels() {
    computeThreshold();
    renderPct();
    nightBtns.forEach(([i, b]) => b.setAttribute("aria-pressed", String(i === state.night)));
    showAll.setAttribute("aria-pressed", String(!state.flaringOnly));
    showFl.setAttribute("aria-pressed", String(state.flaringOnly));
    renderTiles(); renderRank(); renderRegions(); renderLegend();
  }
  function refresh() {
    refreshPanels();
    renderDetail();
    updateClock();
    draw();
  }
  renderValidation();
  renderMethod();
  refresh();
})();
</script>
