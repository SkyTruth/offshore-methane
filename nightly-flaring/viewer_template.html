<title>Nightly Offshore Flaring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a night-watch console. Controls and a full-width night timeline on top;
   map fills the left, a ranked readout panel on the right; stacks on phones.
   Single deliberate dark world: flares glow on one amber ramp over a night ocean. */
:root {
  color-scheme: dark;
  --night: #091017;
  --sea: #0b141c;
  --land: #17212b;
  --coast: #2a3744;
  --panel: #0e1821;
  --raise: #132130;
  --rule: #1e2c39;
  --ink: #e3e9ee;
  --ink-2: #9aa8b4;
  --ink-3: #66747f;
  --flare-1: #5e2b10;
  --flare-2: #923f13;
  --flare-3: #c95d18;
  --flare-4: #f28d27;
  --flare-5: #ffbc5f;
  --flare-6: #ffe4b0;
  --clear: #4a6a80;
  --cloud: #3a4753;
  --focus: #7ad5e9;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--display);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.brand { min-width: 0; }
h1 {
  margin: 0; font-stretch: 72%; font-weight: 760; font-size: 26px; letter-spacing: 0.01em; line-height: 1.1;
  text-wrap: balance;
}
h1 .glow { color: var(--flare-5); text-shadow: 0 0 18px rgba(242, 141, 39, 0.45); }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.sub b { color: var(--ink); font-weight: 600; }
.pill {
  display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--flare-3);
  color: var(--flare-5); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 1px;
}
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button {
  border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer;
  font-variant-numeric: tabular-nums; border-right: 1px solid var(--rule);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--raise); }
.seg button[aria-pressed="true"] { color: var(--night); background: var(--flare-5); font-weight: 650; }
.player {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 3px 10px 3px 3px;
}
.player button {
  border: 0; border-radius: 6px; background: var(--flare-4); color: var(--night); font-weight: 650;
  padding: 4px 10px; cursor: pointer; font-size: 12.5px; min-width: 78px; text-align: left;
}
.player button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.player input { width: 120px; max-width: 30vw; accent-color: var(--flare-4); margin: 0; }
.pct {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 4px 10px;
  font-size: 12.5px; color: var(--ink-2);
}
.pct input { width: 150px; max-width: 40vw; accent-color: var(--flare-4); margin: 0; }
.pct output { font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 21ch; }

.timeline { position: relative; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 8px 12px 4px; }
.tl-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.tl-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); }
.tl-title span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); margin-left: 6px; font-size: 11.5px; }
.tl-range { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--ink-2); }
.tl-range b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.linkbtn { border: 1px solid var(--rule); background: transparent; color: var(--focus); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 11.5px; }
#strip { display: block; width: 100%; height: 74px; touch-action: none; }
#strip .selection { fill: var(--focus); fill-opacity: 0.08; stroke: var(--focus); stroke-opacity: 0.6; }
.tl-tip {
  position: absolute; z-index: 6; pointer-events: none; background: rgba(10, 18, 26, 0.96); border: 1px solid var(--coast);
  border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap;
}
.tl-tip b { font-family: var(--mono); font-weight: 600; }
.tl-tip span { color: var(--ink-2); }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; }
.mapwrap { position: relative; min-height: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sea); }
#map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.clock {
  position: absolute; left: 10px; top: 10px; pointer-events: none;
  background: rgba(9, 16, 23, 0.78); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 11px 7px;
}
.clock .d { font-stretch: 75%; font-weight: 760; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.clock .s { font-size: 11px; color: var(--ink-2); }
.legend {
  position: absolute; left: 10px; bottom: 10px;
  background: rgba(9, 16, 23, 0.86); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 10px; display: grid; gap: 6px; font-size: 11.5px; color: var(--ink-2); max-width: calc(100% - 20px);
}
.legend .lt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.legend .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { display: block; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button {
  min-width: 34px; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--rule);
  background: rgba(9, 16, 23, 0.86); color: var(--ink); cursor: pointer; font-size: 13px;
}
.zoomctl button:hover { border-color: var(--ink-3); }
.tip {
  position: absolute; z-index: 5; pointer-events: none; width: 262px;
  background: rgba(10, 18, 26, 0.96); border: 1px solid var(--coast); border-radius: 9px;
  padding: 10px 11px 9px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}
.tip .v { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .u { font-size: 11.5px; color: var(--ink-2); margin-left: 4px; }
.tip .nm { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.tip .nm b { color: var(--ink); font-weight: 600; }
.tip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.tip dt { color: var(--ink-3); }
.tip dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .hint { margin-top: 6px; font-size: 11px; color: var(--ink-3); }

.panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.panel > * { flex-shrink: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 13px; min-width: 0; }
h2 {
  margin: 0 0 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2);
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
h2 .aside { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); font-size: 11.5px; text-align: right; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--panel); padding: 10px 12px; min-width: 0; }
.tile .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.tile .num { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile .num small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 3px; }
.tile .ctx { font-size: 11.5px; color: var(--ink-2); }

ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol.rank button {
  width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) 72px 82px; align-items: center; gap: 8px;
  border: 0; border-radius: 6px; background: transparent; padding: 5px 6px; cursor: pointer; text-align: left;
}
ol.rank button:hover, ol.rank button.on { background: var(--raise); }
ol.rank .i { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .n { min-width: 0; }
ol.rank .n b { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .n span { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .val { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .val small { display: block; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 5px 6px; border-bottom: 1px solid var(--rule); text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--display); font-size: 12.5px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raise); }
tr.click:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

.detail-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.detail-head h3 { margin: 0; font-size: 16px; font-stretch: 85%; font-weight: 700; }
.detail-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.close { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.facts div { min-width: 0; }
.facts .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.facts .num { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.note b { color: var(--ink); font-weight: 600; }
.chartkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.chartkey span { display: inline-flex; align-items: center; gap: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; }
a { color: var(--focus); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.copy { border: 1px solid var(--rule); background: transparent; color: var(--ink-2); border-radius: 5px; padding: 0 6px; cursor: pointer; font-size: 11px; }

.val-grid { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--flare-4); border-radius: 4px; }
.bar .pct2 { font-family: var(--mono); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .pct2 small { color: var(--ink-3); }

details.card summary { cursor: pointer; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); }
details.card ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; display: grid; gap: 5px; }
details.card li b { color: var(--ink); font-weight: 600; }
.foot { font-size: 11.5px; color: var(--ink-3); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { display: flex; flex-direction: column; }
  .mapwrap { height: 62vh; min-height: 340px; }
  .panel { overflow: visible; }
  h1 { font-size: 22px; }
}
@media (max-width: 420px) {
  .facts { grid-template-columns: 1fr 1fr; }
  ol.rank button { grid-template-columns: 20px minmax(0, 1fr) 82px; }
  ol.rank .spark { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="brand">
    <h1>Nightly Offshore <span class="glow">Flaring</span></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="controls">
    <div class="player">
      <button type="button" id="play" aria-pressed="false">▶ Play</button>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Night timeline position">
    </div>
    <div class="seg" role="group" aria-label="Value shown">
      <button type="button" id="mode-mean" aria-pressed="true">Range mean</button>
      <button type="button" id="mode-night" aria-pressed="false">Single night</button>
    </div>
    <div class="seg" role="group" aria-label="Sites shown">
      <button type="button" id="show-all" aria-pressed="true">All sites</button>
      <button type="button" id="show-flaring" aria-pressed="false">Flaring only</button>
    </div>
    <label class="pct" for="pct">Hide below
      <input type="range" id="pct" min="0" max="100" step="1" value="0" aria-describedby="pct-out">
      <output id="pct-out" for="pct"></output>
    </label>
  </div>
</header>

<section class="timeline" id="timeline" aria-label="Night timeline">
  <div class="tl-head">
    <div class="tl-title">Radiant heat seen each night <span id="tl-sub">sum over flaring sites · click a night, drag to average a range</span></div>
    <div class="tl-range"><span id="tl-range"></span><button type="button" class="linkbtn" id="tl-reset" hidden>Whole period</button></div>
  </div>
  <svg id="strip" role="img" aria-label="Bar chart of total radiant heat per night"></svg>
  <div class="tl-tip" id="tl-tip" hidden></div>
</section>

<main class="app">
  <section class="mapwrap" id="mapwrap">
    <canvas id="map" role="img" aria-label="Map of offshore oil sites coloured by flare radiant heat"></canvas>
    <div class="clock" id="clock" aria-live="polite"></div>
    <div class="zoomctl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zreset">World</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <aside class="panel" aria-label="Flaring summary">
    <div class="tiles" id="tiles"></div>
    <section class="card" id="detail" hidden></section>
    <section class="card">
      <h2>Strongest flares <span class="aside" id="rank-aside"></span></h2>
      <ol class="rank" id="rank"></ol>
    </section>
    <section class="card">
      <h2>By region <span class="aside">click to zoom</span></h2>
      <div class="tbl-wrap"><table id="regions"></table></div>
    </section>
    <section class="card">
      <h2>Against EOG's 2025 catalog</h2>
      <div id="validation"></div>
    </section>
    <details class="card">
      <summary>Method and caveats</summary>
      <ul id="method"></ul>
    </details>
    <p class="foot" id="foot"></p>
  </aside>
</main>

<script type="application/json" id="flaring-data">__FLARING_DATA__</script>
<script type="application/json" id="basemap">__BASEMAP_TOPOJSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("flaring-data").textContent);
  const TOPO = JSON.parse(document.getElementById("basemap").textContent);
  const META = D.meta, NIGHTS = D.nights, NN = NIGHTS.length, SLOPE = META.bcm_per_mw_year;
  const LONG = NN > 14;
  const CSS = getComputedStyle(document.documentElement);
  const C = {};
  ["sea", "land", "coast", "clear", "cloud", "focus", "ink", "ink-2", "ink-3", "rule", "raise", "panel",
   "flare-1", "flare-2", "flare-3", "flare-4", "flare-5", "flare-6"].forEach(k => {
    C[k] = CSS.getPropertyValue("--" + k).trim();
  });
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SVGNS = "http://www.w3.org/2000/svg";
  const MONO = "IBM Plex Mono, monospace";

  // ---------- data ----------
  const S = D.sites.map(r => ({
    id: r[0], lat: r[1], lon: r[2], nstruct: r[3], st: r[4], rh: r[5], tmax: r[6], mean: r[7],
    region: r[8], mycRegime: r[9], mycBcm: r[10], mycIso: r[11], mycClass: r[12], structs: r[13],
  }));
  S.forEach(s => { s.name = s.region + (s.mycIso ? " · " + s.mycIso : ""); });

  // Nightly totals for the timeline (all sites, independent of filters).
  const NIGHT_TOT = NIGHTS.map((n, i) => {
    let mw = 0, nf = 0, nc = 0;
    for (const s of S) {
      const ch = s.st[i];
      if (ch === "F") { mw += s.rh[i] || 0; nf++; nc++; } else if (ch === "C") nc++;
    }
    return { mw, nf, nc };
  });

  const state = {
    night: -1, range: [0, NN - 1], flaringOnly: false, selected: null, hover: null, hl: null,
    pct: 0, thr: null, nFl: 0, animT: null,
  };

  // Per-site stats over the selected range (mean counts clear no-flare nights as 0).
  function computeRange() {
    const [a, b] = state.range;
    for (const s of S) {
      let sum = 0, nC = 0, nF = 0, nO = 0, nD = 0;
      for (let i = a; i <= b; i++) {
        const ch = s.st[i];
        if (ch === "F") { sum += s.rh[i] || 0; nC++; nF++; nO++; }
        else if (ch === "C") { nC++; nO++; }
        else if (ch === "K") nO++;
        else if (ch === "D") { nD++; nO++; if (s.rh[i] != null) { nC++; sum += s.rh[i]; } }
      }
      s.rFlare = nF; s.rClear = nC; s.rObs = nO; s.rCloudFlare = nD; s.rMean = nC ? sum / nC : null;
    }
  }
  // F flaring (clear sky), D seen lit through cloud, C clear no flare, K cloudy, N not observed
  function statusOf(s) {
    if (state.night < 0) return s.rFlare ? "F" : s.rCloudFlare ? "D" : s.rClear ? "C" : s.rObs ? "K" : "N";
    return s.st[state.night];
  }
  function valueOf(s) {
    if (state.night < 0) return s.rFlare ? s.rMean : null;
    return s.st[state.night] === "F" ? s.rh[state.night] : null;
  }
  function computeThreshold() {
    const vals = S.filter(s => statusOf(s) === "F").map(valueOf).sort(d3.ascending);
    state.nFl = vals.length;
    state.thr = state.pct > 0 && vals.length ? d3.quantileSorted(vals, state.pct / 100) : null;
  }
  function visible(s) {
    const st = statusOf(s);
    if (st === "N") return false;
    if (state.flaringOnly && st !== "F" && st !== "D") return false;
    if (state.thr != null) return st === "F" && valueOf(s) >= state.thr;
    return true;
  }
  // Animation frame at fractional night t: ease between adjacent nights; cloudy
  // or unobserved nights hold the neighbouring clear value at low opacity.
  const nightVal = (s, n) => s.st[n] === "F" ? s.rh[n] : s.st[n] === "C" ? 0 : null;
  function frameValue(s, t) {
    const tt = Math.max(0, Math.min(t, NN - 1));
    const i = Math.floor(tt), j = Math.min(i + 1, NN - 1), f = tt - i, k = Math.round(tt);
    let a = nightVal(s, i), b = nightVal(s, j);
    if (a == null && b == null) return { st: s.st[k], v: null, alpha: 1 };
    if (a == null) a = b;
    if (b == null) b = a;

      const a = x(720 + i * 1440), b = x(720 + (i + 1) * 1440);

      if (i % 2 === 0) root.append(svg("rect", { x: a, y: top, width: b - a, height: ph, fill: C.raise, opacity: inR ? 0.6 : 0.25 }));
      if (i % every === 0) root.append(svgText(a, h - 4, NN <= 10 ? wd(n) + " " + dateOf(n).getUTCDate() : md(n), { "text-anchor": "start" }));
    });
    y.ticks(3).forEach(v => {
      root.append(svg("line", { x1: padL, x2: w - padR, y1: y(v), y2: y(v), stroke: C.rule, "stroke-width": 1 }));
      root.append(svgText(padL - 5, y(v) + 3, fmtMW(v), { "text-anchor": "end" }));
    });
    s.rh.forEach((v, i) => {
      if (v == null) return;
      root.append(svg("line", { x1: x(720 + i * 1440) + 1.5, x2: x(720 + (i + 1) * 1440) - 1.5, y1: y(v), y2: y(v), stroke: C["flare-4"], "stroke-width": 2, "stroke-linecap": "round", opacity: 0.9 }));
    });
    const r0 = LONG ? 2.2 : 3.4;
    rows.forEach(r => {
      const [tm, sat, rh, det, cloud, temp] = r;
      const cx = x(tm), when = new Date(dateOf(NIGHTS[0]).getTime() + tm * 60000);
      const label = D.satellites[sat] + " · " + when.toISOString().slice(5, 16).replace("T", " ") + " UTC · " +
        (det ? fmtMW(rh) + " MW, " + fmtInt(temp) + " K" : (cloud === 0 || cloud === 1) ? "clear, no detection" : "cloudy");
      let m;
      if (det) m = svg("circle", { cx, cy: y(rh), r: r0, fill: C["flare-5"], stroke: C.sea, "stroke-width": 0.8 });
      else if (cloud === 0 || cloud === 1) m = svg("circle", { cx, cy: y(0), r: r0 * 0.75, fill: C.sea, stroke: C.clear, "stroke-width": 1.2 });
      else m = cross(cx, y(0), r0 * 0.7, C["ink-3"]);
      const ttl = svg("title"); ttl.textContent = label; m.append(ttl);
      root.append(m);
    });
    return root;
  }
  function renderDetail() {
    const s = state.selected;
    detail.hidden = !s;
    detail.replaceChildren();
    if (!s) return;
    const close = el("button", { type: "button", class: "close", "aria-label": "Close site detail", text: "Close" });
    close.addEventListener("click", () => select(null, false));
    detail.append(el("div", { class: "detail-head" },
      el("div", null, el("h3", { text: s.name }), el("p", { text: "Site " + s.id + " · " + s.lat.toFixed(4) + ", " + s.lon.toFixed(4) })),
      close));
    const facts = el("div", { class: "facts" });
    const fact = (l, v) => facts.append(el("div", null, el("div", { class: "lbl", text: l }), el("div", { class: "num", text: v })));
    fact("Mean heat", s.rFlare ? fmtMW(s.rMean) + " MW" : "–");
    fact("Gas flared", s.rFlare ? fmtMcm(mcm(s.rMean)) + " M m³/yr" : "–");
    fact("Flaring nights", s.rFlare + "/" + s.rClear);
    detail.append(facts);
    if (!isFull()) detail.append(el("p", { class: "note", text: "Figures cover " + rangeLabel(...state.range) + "; the chart shows the whole period." }));
    detail.append(overpassChart(s, 360, 150));
    const key = el("div", { class: "chartkey" });
    const keySvg = kind => {
      const k = svg("svg", { width: 10, height: 10, viewBox: "0 0 10 10" });
      if (kind === "det") k.append(svg("circle", { cx: 5, cy: 5, r: 3.4, fill: C["flare-5"] }));
      if (kind === "clr") k.append(svg("circle", { cx: 5, cy: 5, r: 2.8, fill: C.sea, stroke: C.clear, "stroke-width": 1.4 }));
      if (kind === "cld") k.append(cross(5, 5, 2.5, C["ink-3"]));
      if (kind === "mean") k.append(svg("line", { x1: 0, x2: 10, y1: 5, y2: 5, stroke: C["flare-4"], "stroke-width": 2 }));
      return k;
    };
    key.append(el("span", null, keySvg("det"), "Detection"), el("span", null, keySvg("clr"), "Clear, no flare"),
      el("span", null, keySvg("cld"), "Cloudy"), el("span", null, keySvg("mean"), "Nightly clear-sky mean"));
    detail.append(key);
    const eog = el("p", { class: "note" });
    if (s.mycRegime) eog.append("EOG MYC25Q4 2025: ", el("b", { text: s.mycRegime }), " " + (s.mycClass || "") + " flare, ",
      el("b", { text: (s.mycBcm * 1000).toFixed(0) + " M m³" }), " flared in 2025 (matched within 1 km).");
    else eog.append("No EOG MYC25Q4 2025 upstream flare within 1 km.");
    detail.append(eog);
    detail.append(el("p", { class: "note", text: "GFW structure IDs: " + s.structs.join(", ") + (s.nstruct > s.structs.length ? " …" : "") }));
    const coords = s.lat.toFixed(5) + ", " + s.lon.toFixed(5);
    const copy = el("button", { type: "button", class: "copy", text: "Copy" });
    copy.addEventListener("click", () => {
      navigator.clipboard.writeText(coords).then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Select text"; });
    });
    detail.append(el("div", { class: "links" },
      el("span", null, el("span", { class: "mono", text: coords }), " ", copy),
      el("a", { href: "https://www.google.com/maps/@" + s.lat + "," + s.lon + ",15z/data=!3m1!1e3", target: "_blank", rel: "noopener", text: "Satellite view ↗" })));
  }
  function select(s, zoomTo) {
    state.selected = s;
    renderDetail();
    renderRank();
    if (s && zoomTo) {
      const k = Math.max(T.k, kWorld * 60);
      go(d3.zoomIdentity.translate(W / 2 - k * s.px, H / 2 - k * s.py).scale(k));
    } else draw();
    if (s && window.matchMedia("(max-width: 900px)").matches) detail.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.selected) select(null, false); });

  // ---------- panel ----------
  const viewLabel = () => state.night < 0 ? "mean " + rangeLabel(...state.range) : wd(NIGHTS[state.night]) + " " + md(NIGHTS[state.night]);
  function renderTiles() {
    const box = document.getElementById("tiles");
    box.replaceChildren();
    const fl = S.filter(s => statusOf(s) === "F" && visible(s));
    const clear = S.filter(s => { const st = statusOf(s); return st === "F" || st === "C"; });
    const mw = d3.sum(fl, valueOf);
    const tile = (lbl, num, unit, sub) => box.append(el("div", { class: "tile" },
      el("div", { class: "lbl", text: lbl }), el("div", { class: "num" }, num, unit ? el("small", { text: unit }) : null),
      el("div", { class: "ctx", text: sub })));
    const lit = S.filter(s => statusOf(s) === "D" && visible(s)).length;
    tile(state.thr != null ? "Flaring sites shown" : "Flaring sites", fmtInt(fl.length), null,
      state.thr != null ? "of " + fmtInt(state.nFl) + " flaring, ≥ " + fmtMW(state.thr) + " MW"
        : "of " + fmtInt(clear.length) + " seen in clear sky" + (lit ? "; " + fmtInt(lit) + " more lit under cloud" : ""));
    tile("Radiant heat", fmtMW(mw), "MW", (state.night < 0 ? "sum of site means" : "sum this night") + (state.thr != null ? ", shown sites" : ""));
    tile("Gas flared (est.)", (mw * SLOPE).toFixed(2), "BCM/yr", "annualised, " + SLOPE + " BCM/yr per MW");
    const seen = S.filter(s => statusOf(s) !== "N").length;
    tile(state.night < 0 ? "Sites observed" : "Clear this night", fmtInt(state.night < 0 ? seen : clear.length), null,
      "of " + fmtInt(META.n_sites) + " oil sites");
  }
  const rankBox = document.getElementById("rank");
  function renderRank() {
    rankBox.replaceChildren();
    const fl = S.filter(s => statusOf(s) === "F" && visible(s)).sort((a, b) => valueOf(b) - valueOf(a)).slice(0, 25);
    document.getElementById("rank-aside").textContent = viewLabel() + ", MW";
    fl.forEach((s, i) => {
      const b = el("button", { type: "button", class: s === state.selected ? "on" : "" },
        el("span", { class: "i", text: String(i + 1) }),
        el("span", { class: "n" }, el("b", { text: s.name }), el("span", { text: "site " + s.id + " · " + s.rFlare + "/" + s.rClear + " nights" })),
        el("span", { class: "spark" }, spark(s, 72, 24)),
        el("span", { class: "val" }, fmtMW(valueOf(s)), el("small", { text: fmtMcm(mcm(valueOf(s))) + " M m³/yr" })));
      b.addEventListener("click", () => select(s, true));
      b.addEventListener("pointerenter", () => { state.hl = s; draw(); });
      b.addEventListener("pointerleave", () => { state.hl = null; draw(); });
      b.addEventListener("focus", () => { state.hl = s; draw(); });
      b.addEventListener("blur", () => { state.hl = null; draw(); });
      rankBox.append(el("li", null, b));
    });
    if (!fl.length) rankBox.append(el("li", { class: "foot", text: "No flares detected for this selection." }));
  }
  function renderRegions() {
    const t = document.getElementById("regions");
    t.replaceChildren();
    const groups = d3.rollups(S.filter(s => statusOf(s) === "F" && visible(s)), v => [v.length, d3.sum(v, valueOf)], s => s.region)
      .sort((a, b) => b[1][1] - a[1][1]);
    const bounds = new Map(D.regions.map(r => [r[0], r.slice(1)]));
    t.append(el("thead", null, el("tr", null, el("th", { text: "Region" }), el("th", { text: "Flaring" }), el("th", { text: "MW" }), el("th", { text: "BCM/yr" }))));
    const tb = el("tbody");
    for (const [name, [n, mw]] of groups) {
      const tr = el("tr", { class: bounds.has(name) ? "click" : "", tabindex: bounds.has(name) ? "0" : "-1" },
        el("td", { text: name }), el("td", { text: fmtInt(n) }), el("td", { text: fmtMW(mw) }), el("td", { text: (mw * SLOPE).toFixed(3) }));
      const zoomTo = () => {
        const b = bounds.get(name); if (!b) return;
        const p0 = proj([b[0], b[3]]), p1 = proj([b[2], b[1]]);
        go(fit(p0[0], p0[1], p1[0], p1[1], 0.04));
      };
      tr.addEventListener("click", zoomTo);
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); zoomTo(); } });
      tb.append(tr);
    }
    t.append(tb);
  }
  function renderLegend() {
    const lg = document.getElementById("legend");
    lg.replaceChildren();
    lg.append(el("div", { class: "lt", text: state.night < 0 ? "Mean radiant heat (MW)" : "Radiant heat (MW)" }));
    const row = el("div", { class: "row" });
    [0.2, 2, 20, 60].forEach(v => {
      const r = radiusOf(v), s = svg("svg", { width: 2 * r + 4, height: 2 * r + 4 });
      s.append(svg("circle", { cx: r + 2, cy: r + 2, r, fill: colorOf(v), stroke: "rgba(9,16,23,0.9)", "stroke-width": 1.5 }));
      row.append(el("span", { class: "k" }, s, fmtMW(v)));
    });
    lg.append(row);
    const row2 = el("div", { class: "row" });
    const dotK = c => { const s = svg("svg", { width: 8, height: 8 }); s.append(svg("circle", { cx: 4, cy: 4, r: 2.6, fill: c })); return s; };
    const ringK = () => { const s = svg("svg", { width: 10, height: 10 }); s.append(svg("circle", { cx: 5, cy: 5, r: 3.6, fill: "none", stroke: C["flare-4"], "stroke-width": 1.3 })); return s; };
    row2.append(el("span", { class: "k" }, ringK(), "lit, seen through cloud"),
      el("span", { class: "k" }, dotK(C.clear), "clear, no flare"), el("span", { class: "k" }, dotK(C.cloud), "cloudy every pass"));
    lg.append(row2);
  }
  function renderValidation() {
    const v = META.validation, box = document.getElementById("validation");
    const km = ((v.match_m || 1000) / 1000).toFixed(0);
    box.append(el("p", { class: "note" }, el("b", { text: fmtInt(v.matched) }), " of " + fmtInt(v.observed) +
      " oil sites seen in clear sky over the whole period match an EOG 2025 upstream flare within " + km +
      " km (one-to-one). Share flagged flaring on at least one clear night, by EOG's 2025 persistence class:"));
    const grid = el("div", { class: "val-grid" });
    ["persistent", "intermittent", "sporadic", "undetected", "insufficient_observations"].forEach(k => {
      if (!v.by_regime[k]) return;
      const [hit, n] = v.by_regime[k], pct = n ? hit / n : 0;
      grid.append(el("div", { class: "bar" }, el("span", { text: k.replace("_", " ") }),
        el("span", { class: "track" }, el("span", { class: "fill", style: "width:" + (pct * 100).toFixed(1) + "%" })),
        el("span", { class: "pct2" }, (pct * 100).toFixed(0) + "% ", el("small", { text: hit + "/" + n }))));
    });
    box.append(grid);
    const p = el("p", { class: "note" });
    if (v.log_r != null) {
      p.append("Pooled clear-sky volume vs EOG 2025: log-log r = ", el("b", { text: v.log_r.toFixed(2) }),
        ", median ratio " + (v.median_ratio != null ? v.median_ratio.toFixed(2) : "–") + " (n = " + v.n_both + "). ");
    }
    if (v.det_freq && v.det_freq.n) {
      p.append("At persistent flares, the median share of clear passes with a detection is ",
        el("b", { text: (v.det_freq.ours * 100).toFixed(0) + "%" }), " here vs " + (v.det_freq.myc * 100).toFixed(0) +
        "% in EOG 2025 (n = " + v.det_freq.n + "). ");
    }
    p.append(el("b", { text: fmtInt(v.unmatched_flaring) }), " flaring sites have no EOG 2025 flare within " + km + " km.");
    box.append(p);
    if (v.regions && v.regions.length) {
      const t = el("table");
      t.append(el("thead", null, el("tr", null, el("th", { text: "Matched sites by region" }), el("th", { text: "Here" }),
        el("th", { text: "EOG 2025" }), el("th", { text: "Sites" }))));
      const tb = el("tbody");
      v.regions.slice().sort((a, b) => b[2] - a[2]).forEach(([name, ours, myc, n]) => {
        tb.append(el("tr", null, el("td", { text: name }), el("td", { text: ours.toFixed(2) }),
          el("td", { text: myc.toFixed(2) }), el("td", { text: fmtInt(n) })));
      });
      t.append(tb);
      box.append(el("p", { class: "note", text: "Annual gas flared, BCM/yr (here: pooled clear-sky mean × " + SLOPE + "):" }),
        el("div", { class: "tbl-wrap" }, t));
    }
  }
  function renderMethod() {
    const ul = document.getElementById("method");
    const li = (b, t) => ul.append(el("li", null, el("b", { text: b }), " " + t));
    if (META.status) li("Status.", META.status);
    li("Detection.", "M10 (1.6 µm) above its aggregation-zone mean + 4σ; hot pixels grouped into clusters within each 16-line scan, kept only when the peak is the brightest M10 pixel within 2 pixels (glow test), confirmed in at least one of M7, M8, M11, M12, M13, and assigned whole to the nearest site within 2 km (after Elvidge et al. 2013, 2019; Zhizhin et al. 2026).");
    li("Fit.", "Single-curve Planck fit per pixel for temperature and source area, weighted by each band's background noise plus a 10% model error; bands are eliminated on large negative residuals and failed fits fall back to 1810 K from M10. Saturated bands are dropped using raw radiance and the SDR QF1 flags.");
    li("Value.", "Radiant heat sums a cluster's pixels above 75% of its brightest (RH75%). A night's value is the mean over clear passes, counting clear passes with no detection as 0; a range mean averages nights with a clear pass.");
    li("Gas volume.", "Annualised with EOG's John Zink calibration, " + SLOPE + " BCM/yr per MW (MYC25Q4). Single nights are noisy; read volumes as rough rates.");
    li("Clear sky.", "NOAA enterprise cloud mask at the site pixel (clear or probably clear), solar zenith ≥ 97°. A detection under cloud counts as clear only when at least 6 of its 8 neighbours are clear; otherwise the night shows as lit through cloud and carries no clear-sky value. Bow-tie-deleted pixels and passes repeated in adjacent granules are excluded.");
    li("Satellites.", "SNPP " + fmtInt(META.by_satellite.SNPP) + ", NOAA-20 " + fmtInt(META.by_satellite["NOAA-20"]) + ", NOAA-21 " + fmtInt(META.by_satellite["NOAA-21"]) + " site passes. " + (META.notes || ""));
    li("Timeline.", "Bars sum the radiant heat of every site seen flaring that night, so cloudy nights and missing satellite passes lower them.");
    li("Sites.", "GFW fixed infrastructure labelled oil and active in the latest month, merged within 750 m (" + fmtInt(META.n_structures) + " structures → " + fmtInt(META.n_sites) + " sites). Region names come from bounding boxes; country codes from the matched EOG flare.");
    li("Not yet modelled.", "M11-only and mid-infrared-only triggers, spectral response, dual-curve background fit, atmospheric correction, cross-satellite calibration, and flagging of non-upstream flares (refineries, terminals) among GFW oil sites.");
  }
  document.getElementById("foot").textContent =
    "NOAA VIIRS SDRs (NOAA Open Data Dissemination): " + fmtInt(META.granules) + " granules with site passes, " + META.gb + " GB read. " +
    "GFW fixed infrastructure. EOG MYC25Q4 (CC BY-NC 4.0). Generated " + META.generated + ".";

  // ---------- controls ----------
  const showAll = document.getElementById("show-all"), showFl = document.getElementById("show-flaring");
  showAll.addEventListener("click", () => { state.flaringOnly = false; refresh(); });
  showFl.addEventListener("click", () => { state.flaringOnly = true; refresh(); });
  const modeMean = document.getElementById("mode-mean"), modeNight = document.getElementById("mode-night");
  modeMean.addEventListener("click", () => { pause(); state.animT = null; state.night = -1; refresh(); });
  modeNight.addEventListener("click", () => { if (state.night < 0) showNight(state.range[1]); });
  const pctIn = document.getElementById("pct"), pctOut = document.getElementById("pct-out");
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
  pctIn.addEventListener("input", () => { state.pct = Number(pctIn.value); refresh(); });
  function renderPct() {
    if (state.thr == null) { pctOut.textContent = "off · all sites"; return; }
    const shown = S.filter(s => statusOf(s) === "F" && visible(s)).length;
    pctOut.textContent = ordinal(state.pct) + " pct · ≥ " + fmtMW(state.thr) + " MW · " + fmtInt(shown) + " sites";
  }
  document.getElementById("zin").addEventListener("click", () => csel.transition().duration(reduceMotion ? 0 : 300).call(zoom.scaleBy, 2));
  document.getElementById("zout").addEventListener("click", () => csel.transition().duration(reduceMotion ? 0 : 300).call(zoom.scaleBy, 0.5));
  document.getElementById("zreset").addEventListener("click", () => go(worldView()));

  // ---------- playback ----------
  const playBtn = document.getElementById("play"), scrub = document.getElementById("scrub");
  const clock = document.getElementById("clock");
  const END_HOLD = 0.6;
  const msPerNight = () => Math.max(300, Math.min(1500, 22000 / (state.range[1] - state.range[0] + 1)));
  let raf = null, lastTs = null, stepAcc = 0;
  function updateClock() {
    clock.replaceChildren();
    if (state.night < 0 && state.animT == null) {
      const [a, b] = state.range;
      clock.append(el("div", { class: "d", text: "Mean " + rangeLabel(a, b) }),
        el("div", { class: "s", text: (b - a + 1) + " nights · clear-sky mean per site" }));
      return;
    }
    const k = Math.max(0, state.night);
    clock.append(el("div", { class: "d", text: wd(NIGHTS[k]) + " " + md(NIGHTS[k]) }),
      el("div", { class: "s", text: "night " + (k + 1) + " of " + NN + " · passes near 01:30 local" }));
  }
  function syncScrub() {
    scrub.min = String(state.range[0]); scrub.max = String(Math.max(state.range[1], state.range[0] + 0.01));
    const pos = state.animT != null ? state.animT : state.night >= 0 ? state.night : state.range[0];
    scrub.value = String(Math.min(pos, state.range[1]));
  }
  function setFrame(t) {
    state.animT = t;
    const k = Math.min(state.range[1], Math.round(Math.min(t, state.range[1])));
    if (k !== state.night) { state.night = k; refreshPanels(); }
    syncScrub(); updateClock(); styleStrip(); draw();
  }
  function tick(ts) {
    const dt = lastTs == null ? 0 : Math.min(ts - lastTs, 100);
    lastTs = ts;
    const [a, b] = state.range;
    let t = state.animT;
    if (reduceMotion) {
      stepAcc += dt;
      if (stepAcc >= msPerNight()) { stepAcc = 0; t = Math.floor(t) + 1; }
    } else t += dt / msPerNight();
    if (t > b + END_HOLD) t = a;
    setFrame(t);
    raf = requestAnimationFrame(tick);
  }
  function play() {
    if (raf) return;
    const [a, b] = state.range;
    if (state.animT == null || state.animT >= b) state.animT = state.night >= a && state.night < b ? state.night : a;
    lastTs = null; stepAcc = 0;
    playBtn.setAttribute("aria-pressed", "true"); playBtn.textContent = "❚❚ Pause";
    setFrame(state.animT);
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    playBtn.setAttribute("aria-pressed", "false"); playBtn.textContent = "▶ Play";
  }
  playBtn.addEventListener("click", () => (raf ? pause() : play()));
  scrub.addEventListener("input", () => { pause(); setFrame(Number(scrub.value)); });

  function refreshPanels() {
    computeThreshold();
    renderPct();
    modeMean.setAttribute("aria-pressed", String(state.night < 0));
    modeNight.setAttribute("aria-pressed", String(state.night >= 0));
    showAll.setAttribute("aria-pressed", String(!state.flaringOnly));
    showFl.setAttribute("aria-pressed", String(state.flaringOnly));
    renderTiles(); renderRank(); renderRegions(); renderLegend();
  }
  function refresh() {
    refreshPanels();
    renderDetail();
    updateClock();
    syncScrub();
    styleStrip();
    draw();
  }

  computeRange();
  renderValidation();
  renderMethod();
  new ResizeObserver(() => { renderStrip(); }).observe(tlBox);
  new ResizeObserver(resize).observe(wrap);
  renderStrip();
  refresh();
})();
</script>
