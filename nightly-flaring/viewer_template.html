<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly Offshore Flaring</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: the timeline on top; map fills the left, a ranked readout panel on the
   right; stacks on phones. Dark mode in the SkyTruth palette (Brand Style Guide
   2026): Blue8 page and Blue7 panels, the flaring tool's Orange family for
   flares, Orange6 as the highlight; serif headings over a grotesque sans. */
:root {
  color-scheme: dark;
  --night: #00131F;   /* Blue8: page */
  --sea: #000D16;     /* map sea, a shade below Blue8 */
  --land: #001929;    /* Blue7 */
  --coast: #1D5072;   /* Blue4 */
  --panel: #001929;   /* Blue7 */
  --raise: #002640;   /* Blue6 */
  --rule: #043352;    /* Blue5 */
  --ink: #F9F6F3;     /* Natural / off-white */
  --ink-2: #9CB7C9;   /* Blue2 */
  --ink-3: #60869F;   /* Blue3 */
  --flare-1: #4C2501; /* Orange8 */
  --flare-2: #7E3D01; /* Orange7 */
  --flare-3: #CA6202; /* Orange6 */
  --flare-4: #FD8E28; /* Orange5 */
  --flare-5: #FEBD81; /* Orange3 */
  --flare-6: #F7E5D4; /* Orange1 */
  --accent: #CA6202;  /* Orange6: buttons, rules, tags */
  --accent-hi: #E06F06;
  --clear: #60869F;   /* Blue3 */
  --cloud: #1D5072;   /* Blue4 */
  --focus: #9FC6BA;   /* Forest2: selection */
  --serif: "Tiempos Fine", "EB Garamond", Georgia, serif;
  --sans: "PP Neue Montreal", Roboto, Arial, sans-serif;
  --num: Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.logo { flex: none; display: block; width: 8rem; padding: 2px 0; color: #fff; }
.logo svg { display: block; width: 100%; height: auto; }
.logo .logo-circle { fill: #043352; } /* dark-blue colourway: Blue5 ring, white wordmark */
.logo .logo-path { fill: #fff; }
.logo-wrap { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.internal { margin: 0; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--flare-5); white-space: nowrap; }
.brand { min-width: 0; flex: 1; padding-left: 22px; border-left: 1px solid var(--rule); }
.views { margin-left: auto; position: relative; z-index: 1; }
.dots { position: absolute; pointer-events: none; }
.top .dots { right: 210px; top: 50%; transform: translateY(-50%); opacity: 0.9; }
@media (max-width: 1279px) { .top .dots { display: none; } }
@media (max-width: 1239px) { .explainer .dots { display: none; } }
h1 {
  margin: 0; font-family: var(--serif); font-weight: 500; font-size: 31px; letter-spacing: -0.005em; line-height: 1.05;
  text-wrap: balance;
}
h1 .glow { color: var(--flare-4); text-shadow: 0 0 22px rgba(253, 142, 40, 0.35); }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.sub b { color: var(--ink); font-weight: 500; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--panel); }
.seg button {
  border: 0; background: transparent; padding: 6px 13px; font-size: 13px; color: var(--ink-2); cursor: pointer;
  font-variant-numeric: tabular-nums; border-right: 1px solid var(--rule);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--raise); }
.seg button[aria-pressed="true"] { color: #fff; background: var(--accent); font-weight: 500; }
.tl-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.playbtn {
  margin-top: 14px; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent); color: #fff; font-weight: 500;
  padding: 8px 16px; cursor: pointer; font-size: 13.5px; min-width: 92px; text-align: left; white-space: nowrap;
}
.playbtn:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.playbtn[aria-pressed="true"] { background: transparent; color: var(--ink); }
.stats { display: grid; gap: 8px; }
.modebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.modeinfo { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.modeinfo b { color: var(--ink); font-weight: 500; }
.pctrow { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 2px 10px; margin: 0 0 10px; font-size: 12px; color: var(--ink-2); }
.pctrow output { text-align: right; font-family: var(--num); font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pctrow input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.info {
  display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; margin-left: 6px; padding: 0;
  border: 1px solid var(--ink-3); border-radius: 50%; background: transparent; color: var(--ink-2); cursor: help;
  font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 11px; line-height: 1; vertical-align: 2px;
  text-transform: none; letter-spacing: 0;
}
.info:hover, .info:focus-visible { border-color: var(--accent); color: var(--ink); }
#infotip {
  position: fixed; z-index: 50; pointer-events: none; max-width: 290px; padding: 8px 11px;
  background: rgba(0, 25, 41, 0.98); border: 1px solid var(--coast); border-radius: 9px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5);
  font-family: var(--sans); font-size: 12.5px; line-height: 1.45; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 400;
}
.val-stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 0; font-size: 12px; }
.val-stats dt { color: var(--ink-3); }
.val-stats dd { margin: 0; text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--ink); }
.legend .seg { justify-self: start; }
.legend-keys { display: grid; gap: 6px; }

.timeline { position: relative; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); padding: 10px 14px 4px; }
.tl-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.tl-title { font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--ink); }
.tl-title span { font-family: var(--sans); font-weight: 400; color: var(--ink-3); margin-left: 8px; font-size: 12px; }
.tl-range { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--ink-2); }
.tl-range .seg { flex-wrap: nowrap; }
.tl-range b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.linkbtn { border: 1px solid var(--accent); background: transparent; color: var(--ink); border-radius: 999px; padding: 2px 11px; cursor: pointer; font-size: 12px; }
.linkbtn:hover { background: var(--accent); color: #fff; }
.seg.sm button { padding: 3px 11px; font-size: 12px; }
#strip { display: block; width: 100%; height: 88px; touch-action: none; }
#strip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
#strip .selection { fill: var(--focus); fill-opacity: 0.08; stroke: var(--focus); stroke-opacity: 0.6; }
.tl-key { display: inline-flex; align-items: center; gap: 5px; }
.tl-key i { display: inline-block; width: 26px; height: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--raise), #C2CED6); }
.tl-tip {
  position: absolute; z-index: 6; pointer-events: none; background: rgba(0, 25, 41, 0.97); border: 1px solid var(--coast);
  border-radius: 8px; padding: 7px 10px; font-size: 12px; width: max-content; max-width: 280px; display: grid; gap: 2px;
}
.tl-tip b { font-weight: 500; }
.tl-tip span { color: var(--ink-2); }
.tl-tip .warn { color: var(--flare-5); }
.tl-tip .hint { color: var(--ink-3); font-size: 11px; margin-top: 2px; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; }
.mapwrap { position: relative; min-height: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--sea); }
#map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.clock {
  position: absolute; left: 10px; top: 10px; pointer-events: none;
  background: rgba(0, 19, 31, 0.84); border: 1px solid var(--rule); border-radius: 10px; padding: 6px 12px 7px;
}
.clock .d { font-family: var(--serif); font-weight: 500; font-size: 24px; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.clock .s { font-size: 11px; color: var(--ink-2); }
.legend {
  position: absolute; left: 10px; bottom: 10px;
  background: rgba(0, 19, 31, 0.88); border: 1px solid var(--rule); border-radius: 10px;
  padding: 9px 11px; display: grid; gap: 6px; font-size: 11.5px; color: var(--ink-2); max-width: calc(100% - 20px);
}
.legend .lt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.legend .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { display: block; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button {
  min-width: 34px; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--rule);
  background: rgba(0, 19, 31, 0.88); color: var(--ink); cursor: pointer; font-size: 13px;
}
.zoomctl button:hover { border-color: var(--ink-3); }
.tip {
  position: absolute; z-index: 5; pointer-events: none; width: 262px;
  background: rgba(0, 25, 41, 0.97); border: 1px solid var(--coast); border-radius: 10px;
  padding: 10px 11px 9px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}
.tip .v { font-family: var(--num); font-size: 19px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .u { font-size: 11.5px; color: var(--ink-2); margin-left: 4px; }
.tip .nm { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.tip .nm b { color: var(--ink); font-weight: 500; }
.tip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.tip dt { color: var(--ink-3); }
.tip dd { margin: 0; text-align: right; font-family: var(--num); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .hint { margin-top: 6px; font-size: 11px; color: var(--ink-3); }

.panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.panel > * { flex-shrink: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 14px 13px; min-width: 0; }
h2 {
  position: relative; margin: 0 0 12px; padding-bottom: 9px; font-family: var(--serif); font-size: 20px; font-weight: 500; color: var(--ink);
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 30px; height: 2px; background: var(--accent); }
h2 .aside { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); font-size: 11.5px; text-align: right; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.tile { background: var(--panel); padding: 10px 12px; min-width: 0; }
.tile .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.tile .num { font-family: var(--serif); font-size: 32px; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; line-height: 1.15; }
.tile .num small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 3px; }
.tile .ctx { font-size: 11.5px; color: var(--ink-2); }

.sortseg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
.sortseg button { padding: 6px 4px; text-align: center; line-height: 1.2; }
.rank-hint { font-size: 11.5px; color: var(--ink-3); margin: 8px 0 6px; }
.rank-hint b { color: var(--ink-2); font-weight: 500; }
.microkey { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 10.5px; color: var(--ink-3); margin: 0 0 6px; }
.microkey span { display: inline-flex; align-items: center; gap: 4px; }
.microkey i { display: inline-block; width: 12px; height: 3px; border-radius: 1px; }
.microkey i.bar { width: 4px; height: 9px; background: var(--flare-4); }
.more { width: 100%; margin-top: 8px; border: 1px solid var(--accent); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px; cursor: pointer; font-size: 12.5px; }
.more:hover { color: #fff; background: var(--accent); }
ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol.rank button {
  width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) 90px 80px; align-items: center; gap: 8px;
  border: 0; border-radius: 6px; background: transparent; padding: 5px 6px; cursor: pointer; text-align: left;
}
ol.rank .spark svg { display: block; width: 100%; height: 26px; }
ol.rank button:hover, ol.rank button.on { background: var(--raise); }
ol.rank .i { font-family: var(--num); font-size: 11px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .n { min-width: 0; }
ol.rank .n b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .n span { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .val { font-family: var(--num); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .val small { display: block; font-size: 10px; color: var(--ink-3); white-space: nowrap; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 5px 6px; border-bottom: 1px solid var(--rule); text-align: right; font-family: var(--num); font-size: 12px; font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--sans); font-size: 12.5px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raise); }
tr.click:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

.detail-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.detail-head h3 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 500; }
.detail-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.close { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 2px 11px; cursor: pointer; color: var(--ink-2); }
.close:hover { color: var(--ink); border-color: var(--ink-3); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.facts div { min-width: 0; }
.facts .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts .num { font-family: var(--serif); font-size: 21px; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; line-height: 1.15; }
.facts .unit { font-size: 10.5px; color: var(--ink-2); }
.subhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 11.5px; color: var(--ink-2); }
.subhead b { color: var(--ink); font-weight: 500; }
.subhead .nav { display: inline-flex; gap: 4px; }
.subhead .nav button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 0 10px; height: 24px; cursor: pointer; color: var(--ink); }
.subhead .nav button:disabled { opacity: 0.35; cursor: default; }
.overview { cursor: ew-resize; touch-action: none; display: block; }
.passbox { min-height: 150px; }
.passbox .foot { padding: 50px 0; text-align: center; }
.note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.note b { color: var(--ink); font-weight: 500; }
.chartkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.chartkey span { display: inline-flex; align-items: center; gap: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { color: #fff; text-decoration-color: var(--flare-4); }
.mono { font-family: var(--num); font-size: 11.5px; }
.copy { border: 1px solid var(--rule); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 0 8px; cursor: pointer; font-size: 11px; }

.val-grid { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--flare-4); border-radius: 4px; }
.bar .pct2 { font-family: var(--num); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .pct2 small { color: var(--ink-3); }

details.card summary { cursor: pointer; font-family: var(--serif); font-size: 19px; font-weight: 500; color: var(--ink); }
details.card ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; display: grid; gap: 5px; }
details.card li b { color: var(--ink); font-weight: 500; }
.foot { font-size: 11.5px; color: var(--ink-3); }

/* "How it works": a long-form reading view in the same palette. */
.views .seg button { font-weight: 500; }
.explainer { position: relative; flex: 1; min-height: 0; min-width: 0; overflow-y: auto; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.explainer .dots { right: 0; top: 0; opacity: 0.85; }
.doc { position: relative; max-width: 820px; margin: 0 auto; padding: 40px 24px 64px; font-size: 16px; line-height: 1.62; color: var(--ink); }
.doc > * { max-width: 100%; }
.doc h1 { font-family: var(--serif); font-size: 46px; font-weight: 500; line-height: 1.05; margin: 0 0 20px; text-wrap: balance; letter-spacing: -0.01em; }
.doc h2 {
  display: block; position: relative; margin: 52px 0 18px; padding-bottom: 12px; font-family: var(--serif); font-size: 34px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.1;
  text-transform: none; color: var(--ink); text-wrap: balance;
}
.doc h2::after { content: ""; position: absolute; left: 0; bottom: 0; width: 40px; height: 3px; background: var(--accent); }
.doc h3 { margin: 34px 0 8px; font-family: var(--serif); font-size: 23px; font-weight: 500; text-wrap: balance; }
.doc h4 { margin: 28px 0 8px; font-family: var(--serif); font-size: 19px; font-weight: 500; color: var(--ink-2); text-wrap: balance; }
.doc p, .doc ul, .doc ol { margin: 0 0 14px; max-width: 68ch; }
.doc ul, .doc ol { padding-left: 22px; display: grid; gap: 6px; }
.doc strong { font-weight: 700; color: var(--ink); }
.doc em { color: var(--ink-2); }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0 8px; }
.doc code { font-family: var(--num); font-size: 0.88em; }
.doc figure { margin: 22px 0 8px; overflow-x: auto; }
.doc figure svg { display: block; width: 100%; height: auto; min-width: 540px; }
.doc figure.photo img { display: block; width: 100%; height: auto; min-width: 540px; border-radius: 10px; }

<script type="application/json" id="flaring-data">__FLARING_DATA__</script>
<script type="application/json" id="flareouts-data">__FLAREOUTS_DATA__</script>
<script type="application/json" id="basemap">__BASEMAP_TOPOJSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("flaring-data").textContent);
  const TOPO = JSON.parse(document.getElementById("basemap").textContent);
  const META = D.meta, NIGHTS = D.nights, NN = NIGHTS.length, SLOPE = META.bcm_per_mw_year;
  const CSS = getComputedStyle(document.documentElement);
  const C = {};
  ["sea", "land", "coast", "clear", "cloud", "focus", "ink", "ink-2", "ink-3", "rule", "raise", "panel",
   "flare-1", "flare-2", "flare-3", "flare-4", "flare-5", "flare-6"].forEach(k => {
    C[k] = CSS.getPropertyValue("--" + k).trim();
  });
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SVGNS = "http://www.w3.org/2000/svg";
  const MONO = "Roboto, Arial, sans-serif";

  // ---------- data ----------
  // st: one code per night (F flaring, D lit through cloud, C clear no flare,
  // K cloudy, N not observed). rv: clear-sky MW for each F/D night in order.
  // cp: clear passes per night, one base-36 digit (sites that flared only).
  const S = D.sites.map(r => {
    const st = r[4], rv = r[5], rh = new Array(NN);
    let k = 0;
    for (let i = 0; i < NN; i++) {
      const ch = st[i];
      rh[i] = ch === "C" ? 0 : (ch === "F" || ch === "D") ? rv[k++] : null;
    }
    let cp = null;
    if (r[14]) { cp = new Uint8Array(NN); for (let i = 0; i < NN; i++) cp[i] = parseInt(r[14][i], 36); }
    return {
      id: r[0], lat: r[1], lon: r[2], nstruct: r[3], st, rh, tmax: r[6], mean: r[7],
      region: r[8], mycRegime: r[9], mycBcm: r[10], mycIso: r[11], mycClass: r[12], structs: r[13], cp,
      max: d3.max(rh) || 0,
    };
  });
  S.forEach(s => { s.name = s.region + (s.mycIso ? " · " + s.mycIso : ""); });

  // Nightly totals for the timeline (all sites, independent of filters).
  const NIGHT_TOT = NIGHTS.map((n, i) => {
    let mw = 0, nf = 0, nc = 0, no = 0;
    for (const s of S) {
      const ch = s.st[i];
      if (ch !== "N") no++;
      if (ch === "F") { mw += s.rh[i] || 0; nf++; nc++; } else if (ch === "C") nc++;
    }
    return { mw, nf, nc, no };
  });
  // A night is partial when far fewer sites were passed over than usual
  // (satellite files missing at either end of the archive).
  const OBS_TYPICAL = d3.median(NIGHT_TOT, d => d.no) || 1;
  NIGHT_TOT.forEach(d => { d.partial = d.no < 0.9 * OBS_TYPICAL; });

  const RANK_PAGE = window.matchMedia("(max-width: 900px)").matches ? 10 : 25;
  const state = {
    night: -1, range: [0, NN - 1], flaringOnly: false, selected: null, hover: null, hl: null,
    pct: 0, thr: null, nFl: 0, animT: null, sort: "strong", rankN: RANK_PAGE, win: null, winManual: false,
  };

  // Lower end of the 95% Wilson interval for k successes in n trials.
  function wilsonLo(k, n) {
    if (!n) return 0;
    const z = 1.96, z2 = z * z, p = k / n;
    return (p + z2 / (2 * n) - z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n))) / (1 + z2 / n);
  }
  // Per-site stats over the selected range (mean counts clear no-flare nights as 0).
  function computeRange() {
    const [a, b] = state.range;
    for (const s of S) {
      let sum = 0, nC = 0, nF = 0, nO = 0, nD = 0, nP = 0;
      for (let i = a; i <= b; i++) {
        const ch = s.st[i];
        if (ch === "F") { sum += s.rh[i] || 0; nC++; nF++; nO++; }
        else if (ch === "C") { nC++; nO++; }
        else if (ch === "K") nO++;
        else if (ch === "D") { nD++; nO++; if (s.rh[i] != null) { nC++; sum += s.rh[i]; } }
        if (s.cp) nP += s.cp[i];
      }
      s.rFlare = nF; s.rClear = nC; s.rObs = nO; s.rCloudFlare = nD; s.rMean = nC ? sum / nC : null;
      s.rPasses = nP; s.rShare = nC ? nF / nC : 0; s.rLo = wilsonLo(nF, nC);
    }
  }
  // F flaring (clear sky), D seen lit through cloud, C clear no flare, K cloudy, N not observed
  function statusOf(s) {
    if (state.night < 0) return s.rFlare ? "F" : s.rCloudFlare ? "D" : s.rClear ? "C" : s.rObs ? "K" : "N";
    return s.st[state.night];
  }
  function valueOf(s) {
    if (state.night < 0) return s.rFlare ? s.rMean : null;
    return s.st[state.night] === "F" ? s.rh[state.night] : null;
  }
  // The radiant-heat filter ranks sites once, by mean clear-sky radiant heat over
  // the selected nights, so the same sites stay shown on a single night and while
  // playing (a per-night cut-off made sites, and an opened site, blink in and out).
  function computeThreshold() {
    const vals = S.filter(s => s.rFlare > 0).map(s => s.rMean).sort(d3.ascending);
    state.nFl = vals.length;
    state.thr = state.pct > 0 && vals.length ? d3.quantileSorted(vals, state.pct / 100) : null;
    state.nPass = state.thr == null ? vals.length : vals.filter(v => v >= state.thr).length;
  }
  const passesThr = s => state.thr == null || (s.rFlare > 0 && s.rMean >= state.thr);
  // inFilter: counted in the list, regions and totals. visible: drawn on the map,
  // where an opened site always shows its state for the night.
  function inFilter(s) {
    const st = statusOf(s);
    if (st === "N" || !passesThr(s)) return false;
    if (state.flaringOnly && st !== "F" && st !== "D") return false;
    return true;
  }
  function visible(s) { return s === state.selected ? statusOf(s) !== "N" : inFilter(s); }
  // Animation frame at fractional night t: ease between adjacent nights; cloudy
  // or unobserved nights hold the neighbouring clear value at low opacity.
  const nightVal = (s, n) => s.st[n] === "F" ? s.rh[n] : s.st[n] === "C" ? 0 : null;
  function frameValue(s, t) {
    const tt = Math.max(0, Math.min(t, NN - 1));
    const i = Math.floor(tt), j = Math.min(i + 1, NN - 1), f = tt - i, k = Math.round(tt);
    let a = nightVal(s, i), b = nightVal(s, j);
    if (a == null && b == null) return { st: s.st[k], v: null, alpha: 1 };
    if (a == null) a = b;
    if (b == null) b = a;
    const e = reduceMotion ? (f < 0.5 ? 0 : 1) : f * f * (3 - 2 * f);
    const known = s.st[k] === "F" || s.st[k] === "C";
    return { st: s.st[k], v: a + (b - a) * e, alpha: known ? 1 : 0.32 };
  }

  // ---------- formatting ----------
  const fmtMW = v => v == null ? "–" : v === 0 ? "0" : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
  const fmtInt = d3.format(",");
  const mcm = mw => mw * SLOPE * 1000; // million m3 per year
  const fmtMcm = v => v >= 100 ? d3.format(",.0f")(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  const dateOf = iso => new Date(iso + "T00:00:00Z");
  const wd = iso => dateOf(iso).toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });

    const passes=n.passes.map(([sat,seconds,clear,zone,detected])=>[DN.pass_satellites[sat],new Date(+dateOf(n.night)+seconds*1000).toISOString(),clear,DN.pass_view_zones[zone],detected]);
    const dates=[...new Set(passes.map(p=>p[1].slice(0,10)))].join(", ");
    box.append(el("h4",{text:"Passes · "+dates+" UTC"}),
      foTable(["Satellite","UTC","Clear","View","Seen"],passes.map(([sat,time,clear,zone,detected])=>[sat,time.slice(11,19),clear?"yes":"no",zone,detected?"yes":"no"])));
    return box;
  }
  function dnDetail(run) {
    const source=DN.sources[run.source_id];
    const box=el("section",{class:"fo-detail dn-detail","aria-label":"Selected dark run"},
      el("h2",{text:dnName(run)}),el("p",{text:run.start+" to "+run.end+" · "+dnCount(run.clear_dark_nights,"clear dark night")+" in the run · "+dnCount(run.nights.length,"qualifying night")+" listed."}),dnChart(run));
    for(const id of run.neighbours){
      const neighbour=DN.runs.find(r=>r.id===id);
      const link=el("a",{href:"#flare-outs/dark-nights/"+encodeURIComponent(id),text:dnName(neighbour)+" · "+neighbour.start+" to "+neighbour.end});
      link.addEventListener("click",event=>{event.preventDefault();history.replaceState(null,"",link.getAttribute("href"));dnChoose?.(neighbour,true);});
      box.append(el("p",null,"A neighbouring source within 1.5 km was also dark: ",link,". The detection apertures overlap."));
    }
    box.append(el("details",null,el("summary",{text:"VIIRS bracket"}),foTable(["Pass","Time UTC"],[["Last saw the flare",run.bracket.last_lit],["First clear dark pass",run.bracket.first_dark],["Last clear dark pass",run.bracket.last_dark],["First saw it after",run.bracket.recovery]])),
      el("p",{class:"fo-muted",text:"Labels follow VIIRS passes. A daytime scene beside a single dark night is boundary: its timing cannot establish what happened between passes. Scene cloud is the share of scene area, not cloud at this source."}),
      dnScenes("EMIT scenes near the dark run",dnSceneRefs(run),source.emit_status),
      dnScenes("Comparison scenes · lit on both sides",source.comparison_scenes.map(id=>({...source.scenes[id],phase:"lit on both sides"})),source.emit_status),
      el("p",{class:"fo-muted",text:DN.caption}),dnMap(run));
    if(run.card_id)box.append(el("p",null,el("a",{href:"#flare-outs/card/"+encodeURIComponent(run.card_id),text:"Open the flare-out card →"})));
    for(const n of run.nights)box.append(dnNight(n));
    return box;
  }
  function renderDarkNights() {
    const c=DN.counts,total=c.runs;
    dnRoot.replaceChildren(el("h1",{text:"Single dark nights"}),el("div",{class:"dn-summary"},
      el("span",{text:dnCount(total,"dark run")+" · "+dnCount(c.dark_nights,"qualifying night")+" at "+dnCount(c.sources,"source")+" · EMIT nearby "+fmtInt(c.with_emit_nearby)+"/"+fmtInt(c.dark_nights)+" nights · chips "+fmtInt(c.with_chips)+"/"+fmtInt(c.dark_nights)+" nights · provisional "+fmtInt(c.provisional)+"/"+fmtInt(c.dark_nights)+" nights · as of "+DN.as_of}),
      infoBtn("single dark night definitions",Object.values(DN.definitions).join(" "))),
      el("p",{class:"fo-muted",text:DN.limits}),el("a",{href:"#how-it-works/single-dark-nights",text:"How single dark nights are selected →"}));
    const emitOnly=el("input",{type:"checkbox",checked:""}),heat=el("select",{"aria-label":"Minimum recent heat"}),region=el("select",{"aria-label":"Region"}),sort=el("select",{"aria-label":"Sort dark runs"});
    for(const [v,t] of [["any","Any"],["0.5","0.5 MW"],["1","1 MW"],["3","3 MW"]])heat.append(el("option",{value:v,text:t}));
    region.append(el("option",{value:"",text:"All regions"}));
    for(const r of [...new Set(Object.values(DN.sources).map(s=>s.unit.region))].sort())region.append(el("option",{value:r,text:r}));
    for(const [v,t] of [["surprise","Most surprising"],["heat","Brightest"],["recent","Most recent"]])sort.append(el("option",{value:v,text:t}));
    const filters=el("div",{class:"dn-filters"},el("label",{class:"dn-check"},emitOnly,"With an EMIT scene"),el("label",null,"Minimum recent heat",heat),el("label",null,"Region",region),el("label",null,"Sort",sort));
    const count=el("p",{class:"fo-muted",role:"status"}),list=el("div",{class:"fo-list",role:"group","aria-label":"Dark runs"}),detail=el("div"),more=el("button",{type:"button",class:"dn-more",text:"Show more"});
    dnRoot.append(filters,count,el("div",{class:"fo-workspace"},el("div",null,list,more),detail));
    let filtered=[],limit=50,selected=null;
    function choose(run,scroll){
      selected=run.id;
      list.querySelectorAll(".dn-row").forEach(r=>r.setAttribute("aria-current",String(r.dataset.id===selected)));
      detail.replaceChildren(dnDetail(run));
      if(scroll&&matchMedia("(max-width:700px)").matches)detail.scrollIntoView({block:"start"});
    }
    dnChoose=(run,scroll)=>{
      // A neighbour may be outside the current filters; make its selection visible.
      if(!filtered.some(r=>r.id===run.id)){emitOnly.checked=false;heat.value="any";region.value="";apply(run.id);}
      const index=filtered.findIndex(r=>r.id===run.id);limit=Math.max(limit,index+1);selected=run.id;rows();choose(run,scroll);
    };
    function rows(){
      list.replaceChildren();
      for(const run of filtered.slice(0,limit)){
        const n=dnBest(run),b=n.burning_rate,source=DN.sources[run.source_id],scenes=dnSceneRefs(run);
        const row=el("button",{type:"button",class:"fo-row dn-row","aria-current":String(run.id===selected)});row.dataset.id=run.id;
        row.append(el("strong",{class:"fo-name",text:dnName(run)}),
          el("span",{class:"fo-status",text:run.start+" to "+run.end+" · "+dnCount(run.clear_dark_nights,"clear dark night")+" · "+dnCount(run.nights.length,"qualifying night")+" listed"}),
          el("span",{class:"fo-stats",text:"Best night "+n.night+": burning "+dnRate(b.lit/b.qualified,b.lit,b.qualified)+" clear nights · "+foHeat(n.recent_heat_mw)+" (n="+n.recent_heat_n+") · "+dnCount(n.expected_misses.k,"clear pass","clear passes")}),
          el("span",{class:"fo-chip",text:"EMIT: "+scenes.length+" near / "+scenes.filter(emitUsable).length+" with chips"}));
        if(b.neighbour_only)row.append(el("span",{class:"fo-muted",text:dnCount(b.neighbour_only,"neighbour-only night")+" excluded from rate"}));
        if(source.emit_status!=="available")row.append(el("span",{class:"fo-chip",text:"EMIT listing "+source.emit_status}));
        if(run.nights.some(n=>n.provisional))row.append(el("span",{class:"fo-chip",text:"provisional nights"}));
        if(run.card_id)row.append(el("span",{class:"fo-chip",text:"part of a flare-out card"}));
        if(run.neighbours.length)row.append(el("span",{class:"fo-chip",text:"neighbour also dark within 1.5 km"}));
        row.addEventListener("click",()=>{history.replaceState(null,"","#flare-outs/dark-nights/"+encodeURIComponent(run.id));choose(run,true);});list.append(row);
      }
      more.hidden=filtered.length<=limit;
      count.textContent="Showing "+Math.min(limit,filtered.length)+" of "+fmtInt(filtered.length)+" matching runs ("+fmtInt(filtered.length)+"/"+fmtInt(total)+" in the record).";
    }
    function apply(preferred){
      limit=50;filtered=DN.runs.filter(r=>(!emitOnly.checked||r.emit_scenes.length>0)&&(heat.value==="any"||r.nights.some(n=>n.recent_heat_mw!=null&&n.recent_heat_mw>=+heat.value))&&(!region.value||DN.sources[r.source_id].unit.region===region.value));
      if(sort.value==="heat")filtered.sort((a,b)=>d3.max(b.nights,n=>n.recent_heat_mw??-1)-d3.max(a.nights,n=>n.recent_heat_mw??-1)||dnCompare(dnBest(a),dnBest(b)));
      if(sort.value==="recent")filtered.sort((a,b)=>b.nights[b.nights.length-1].night.localeCompare(a.nights[a.nights.length-1].night)||dnCompare(dnBest(a),dnBest(b)));
      const chosen=filtered.find(r=>r.id===(typeof preferred==="string"?preferred:selected))||filtered[0];selected=chosen?.id||null;rows();
      if(chosen)choose(chosen,false);else{detail.replaceChildren(el("p",{text:"No matching dark runs. Change the filters to see more."}));list.append(el("p",{text:"No matching runs."}));}
    }
    for(const input of [emitOnly,heat,region,sort])input.addEventListener("change",()=>apply());
    more.addEventListener("click",()=>{limit+=50;rows();});apply();
    const id=location.hash.split("/")[2];if(id){const run=DN.runs.find(r=>r.id===decodeURIComponent(id));if(run)dnChoose(run,false);}
  }
  async function loadDarkNights() {
    if(DN||dnLoading)return;
    dnLoading=true;dnRoot.replaceChildren(el("p",{role:"status",text:"Loading single dark nights…"}));
    try{
      const response=await fetch("darknights.json");if(!response.ok)throw new Error("listing unavailable");
      DN=await response.json();renderDarkNights();
    }catch(error){
      DN=null;const retry=el("button",{type:"button",class:"dn-more",text:"Retry"});retry.addEventListener("click",loadDarkNights);
      dnRoot.replaceChildren(el("p",{role:"status",text:"Single dark nights could not be loaded."}),retry);
    }finally{dnLoading=false;}
  }
  function showFlareMode() {
    const dark=location.hash==="#flare-outs/dark-nights"||location.hash.startsWith("#flare-outs/dark-nights/");
    foRoot.hidden=dark;dnRoot.hidden=!dark;spellMode.setAttribute("aria-pressed",String(!dark));nightMode.setAttribute("aria-pressed",String(dark));
    if(dark){
      loadDarkNights();
      const id=location.hash.split("/")[2];
      if(DN&&id){const run=DN.runs.find(r=>r.id===decodeURIComponent(id));if(run)dnChoose?.(run,false);}
    }
    if(location.hash.startsWith("#flare-outs/card/")){
      const card=FL.candidates.find(c=>c.id===decodeURIComponent(location.hash.slice(17)));if(card&&foChoose)foChoose(card,true);
    }
  }
  for(const [button,hash] of [[spellMode,"#flare-outs"],[nightMode,"#flare-outs/dark-nights"]])button.addEventListener("click",()=>{history.replaceState(null,"",hash);setView("flareouts",false);});

  // ---------- how it works: dynamic contents rail ----------
  const exBox = document.getElementById("explainer"), exDoc = document.getElementById("explainer-doc");
  const exHeads = [...exDoc.querySelectorAll("h2[id], h3[id]")];
  const exLinks = new Map();
  const tocNarrow = window.matchMedia("(max-width: 1099px)");
  function goToSection(id, push, smooth = false) {
    const t = document.getElementById(id);
    if (!t || !exDoc.contains(t)) return;
    t.scrollIntoView({ behavior: smooth && !reduceMotion ? "smooth" : "auto", block: "start" });
    if (push) history.replaceState(null, "", "#how-it-works/" + id);
  }
  const tocNav = document.getElementById("ex-toc"), tocBox = el("details");
  (function buildToc() {
    const list = el("ol");
    let sub = null;
    for (const h of exHeads) {
      const a = el("a", { href: "#how-it-works/" + h.id, text: h.textContent });
      a.addEventListener("click", e => {
        e.preventDefault();
        if (tocNarrow.matches) tocBox.open = false;
        goToSection(h.id, true, true);
      });
      exLinks.set(h, a);
      if (h.tagName === "H2" || !sub) {
        sub = el("ol", { class: "ex-toc-l3" });
        list.append(el("li", { class: "ex-toc-h2" }, a, sub));
      } else sub.append(el("li", null, a));
    }
    const summary = el("summary", { text: "On this page" });
    summary.addEventListener("click", e => { if (!tocNarrow.matches) e.preventDefault(); });
    tocBox.append(summary, list);
    tocNav.append(tocBox);
    const mode = () => { tocBox.open = !tocNarrow.matches; };
    tocNarrow.addEventListener("change", mode);
    mode();
  })();
  let tocCurrent = null, tocQueued = false;
  function tocUpdate() {
    tocQueued = false;
    if (exBox.hidden || !exHeads.length) return;
    const line = Math.max(exBox.getBoundingClientRect().top, 0) + 96;
    let act = exHeads[0];
    for (const h of exHeads) { if (h.getBoundingClientRect().top <= line) act = h; else break; }
    if (act === tocCurrent) return;
    tocCurrent = act;
    for (const a of exLinks.values()) a.removeAttribute("aria-current");
    const a = exLinks.get(act);
    a.setAttribute("aria-current", "true");
    const group = a.closest(".ex-toc-h2");
    tocNav.querySelectorAll(".ex-toc-h2").forEach(li => li.classList.toggle("open", li === group));
    if (!tocNarrow.matches) {  // keep the marked entry inside the rail's own scroll
      const top = a.offsetTop, bottom = top + a.offsetHeight;
      if (top < tocNav.scrollTop + 8) tocNav.scrollTop = top - 28;
      else if (bottom > tocNav.scrollTop + tocNav.clientHeight - 8) tocNav.scrollTop = bottom - tocNav.clientHeight + 28;
    }
  }
  const tocSchedule = () => { if (!tocQueued) { tocQueued = true; requestAnimationFrame(tocUpdate); } };
  exBox.addEventListener("scroll", tocSchedule, { passive: true });
  window.addEventListener("scroll", tocSchedule, { passive: true });
  window.addEventListener("resize", tocSchedule);
  const sectionFromHash = () => location.hash.startsWith("#how-it-works/") ? decodeURIComponent(location.hash.slice(14)) : null;

  // ---------- views: map / how it works (#how-it-works) ----------
  const views = {
    map: [document.getElementById("timeline"), document.querySelector("main.app")],
    how: [document.getElementById("explainer")],
    flareouts: [document.getElementById("flareouts")],
  };
  const viewBtn = { map: document.getElementById("view-map"), how: document.getElementById("view-how"), flareouts: document.getElementById("view-flareouts") };
  function setView(name, push) {
    for (const [k, els] of Object.entries(views)) {
      els.forEach(e => { e.hidden = k !== name; });
      viewBtn[k].setAttribute("aria-pressed", String(k === name));
    }
    if (name !== "map") pause();
    if (name === "how") { tocCurrent = null; tocSchedule(); }
    if (push) {
      const h = name === "how" ? "#how-it-works" : name === "flareouts" ? "#flare-outs" : "#map";
      if (location.hash !== h) history.replaceState(null, "", h);
    }
    if (name === "flareouts") showFlareMode();
  }
  const viewFromHash = () => location.hash.startsWith("#how-it-works") ? "how" : location.hash.startsWith("#flare-outs") ? "flareouts" : "map";
  viewBtn.map.addEventListener("click", () => setView("map", true));
  viewBtn.how.addEventListener("click", () => { setView("how", true); document.getElementById("explainer").scrollTop = 0; });
  viewBtn.flareouts.addEventListener("click", () => setView("flareouts", true));
  window.addEventListener("hashchange", () => {
    setView(viewFromHash(), false);
    const id = sectionFromHash();
    if (id) goToSection(id, false);
  });

  renderFlareouts();
  computeRange();
  renderValidation();
  renderMethod();
  setView(viewFromHash(), false);
  if (sectionFromHash()) requestAnimationFrame(() => { goToSection(sectionFromHash(), false); tocSchedule(); });
  new ResizeObserver(() => { renderStrip(); }).observe(tlBox);
  new ResizeObserver(resize).observe(wrap);
  renderStrip();
  refresh();
})();
