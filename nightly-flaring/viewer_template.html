<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly Offshore Flaring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23091017%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2211%22 fill=%22%23f28d27%22 opacity=%22.35%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%226.5%22 fill=%22%23ffbc5f%22/%3E%3C/svg%3E">
<meta name="description" content="Nightly gas flaring at 7,637 offshore oil sites from VIIRS satellite data, after EOG's VIIRS Nightfire method, with an explainer of the science and its limits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a night-watch console. Controls and a full-width night timeline on top;
   map fills the left, a ranked readout panel on the right; stacks on phones.
   Single deliberate dark world: flares glow on one amber ramp over a night ocean. */
:root {
  color-scheme: dark;
  --night: #091017;
  --sea: #0b141c;
  --land: #17212b;
  --coast: #2a3744;
  --panel: #0e1821;
  --raise: #132130;
  --rule: #1e2c39;
  --ink: #e3e9ee;
  --ink-2: #9aa8b4;
  --ink-3: #66747f;
  --flare-1: #5e2b10;
  --flare-2: #923f13;
  --flare-3: #c95d18;
  --flare-4: #f28d27;
  --flare-5: #ffbc5f;
  --flare-6: #ffe4b0;
  --clear: #4a6a80;
  --cloud: #3a4753;
  --focus: #7ad5e9;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--display);
  font-size: 14px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.brand { min-width: 0; }
h1 {
  margin: 0; font-stretch: 72%; font-weight: 760; font-size: 26px; letter-spacing: 0.01em; line-height: 1.1;
  text-wrap: balance;
}
h1 .glow { color: var(--flare-5); text-shadow: 0 0 18px rgba(242, 141, 39, 0.45); }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.sub b { color: var(--ink); font-weight: 600; }
.pill {
  display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--flare-3);
  color: var(--flare-5); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: 1px;
}
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button {
  border: 0; background: transparent; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer;
  font-variant-numeric: tabular-nums; border-right: 1px solid var(--rule);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: var(--raise); }
.seg button[aria-pressed="true"] { color: var(--night); background: var(--flare-5); font-weight: 650; }
.player {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 3px 10px 3px 3px;
}
.player button {
  border: 0; border-radius: 6px; background: var(--flare-4); color: var(--night); font-weight: 650;
  padding: 4px 10px; cursor: pointer; font-size: 12.5px; min-width: 78px; text-align: left;
}
.player button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.player input { width: 120px; max-width: 30vw; accent-color: var(--flare-4); margin: 0; }
.pct {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 4px 10px;
  font-size: 12.5px; color: var(--ink-2);
}
.pct input { width: 150px; max-width: 40vw; accent-color: var(--flare-4); margin: 0; }
.pct output { font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 21ch; }

.timeline { position: relative; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 8px 12px 4px; }
.tl-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.tl-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); }
.tl-title span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); margin-left: 6px; font-size: 11.5px; }
.tl-range { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--ink-2); }
.tl-range .seg { flex-wrap: nowrap; }
.tl-range b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.linkbtn { border: 1px solid var(--rule); background: transparent; color: var(--focus); border-radius: 6px; padding: 1px 8px; cursor: pointer; font-size: 11.5px; }
.seg.sm button { padding: 3px 9px; font-size: 11.5px; }
#strip { display: block; width: 100%; height: 88px; touch-action: none; }
#strip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
#strip .selection { fill: var(--focus); fill-opacity: 0.08; stroke: var(--focus); stroke-opacity: 0.6; }
.tl-key { display: inline-flex; align-items: center; gap: 5px; }
.tl-key i { display: inline-block; width: 26px; height: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--raise), #9cbdd2); }
.tl-tip {
  position: absolute; z-index: 6; pointer-events: none; background: rgba(10, 18, 26, 0.96); border: 1px solid var(--coast);
  border-radius: 8px; padding: 7px 10px; font-size: 12px; width: max-content; max-width: 280px; display: grid; gap: 2px;
}
.tl-tip b { font-weight: 650; }
.tl-tip span { color: var(--ink-2); }
.tl-tip .warn { color: var(--flare-5); }
.tl-tip .hint { color: var(--ink-3); font-size: 11px; margin-top: 2px; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 12px; }
.mapwrap { position: relative; min-height: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--sea); }
#map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.clock {
  position: absolute; left: 10px; top: 10px; pointer-events: none;
  background: rgba(9, 16, 23, 0.78); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 11px 7px;
}
.clock .d { font-stretch: 75%; font-weight: 760; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.clock .s { font-size: 11px; color: var(--ink-2); }
.legend {
  position: absolute; left: 10px; bottom: 10px;
  background: rgba(9, 16, 23, 0.86); border: 1px solid var(--rule); border-radius: 8px;
  padding: 8px 10px; display: grid; gap: 6px; font-size: 11.5px; color: var(--ink-2); max-width: calc(100% - 20px);
}
.legend .lt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.legend .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { display: block; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button {
  min-width: 34px; height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--rule);
  background: rgba(9, 16, 23, 0.86); color: var(--ink); cursor: pointer; font-size: 13px;
}
.zoomctl button:hover { border-color: var(--ink-3); }
.tip {
  position: absolute; z-index: 5; pointer-events: none; width: 262px;
  background: rgba(10, 18, 26, 0.96); border: 1px solid var(--coast); border-radius: 9px;
  padding: 10px 11px 9px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
}
.tip .v { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .u { font-size: 11.5px; color: var(--ink-2); margin-left: 4px; }
.tip .nm { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.tip .nm b { color: var(--ink); font-weight: 600; }
.tip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.tip dt { color: var(--ink-3); }
.tip dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tip .hint { margin-top: 6px; font-size: 11px; color: var(--ink-3); }

.panel { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.panel > * { flex-shrink: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 13px; min-width: 0; }
h2 {
  margin: 0 0 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2);
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
}
h2 .aside { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); font-size: 11.5px; text-align: right; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--panel); padding: 10px 12px; min-width: 0; }
.tile .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.tile .num { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile .num small { font-size: 12px; color: var(--ink-2); font-weight: 400; margin-left: 3px; }
.tile .ctx { font-size: 11.5px; color: var(--ink-2); }

.sortseg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
.sortseg button { padding: 6px 4px; text-align: center; line-height: 1.2; }
.rank-hint { font-size: 11.5px; color: var(--ink-3); margin: 7px 0 6px; min-height: 2.4em; }
.rank-hint b { color: var(--ink-2); font-weight: 600; }
.microkey { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 10.5px; color: var(--ink-3); margin: 0 0 6px; }
.microkey span { display: inline-flex; align-items: center; gap: 4px; }
.microkey i { display: inline-block; width: 12px; height: 3px; border-radius: 1px; }
.microkey i.bar { width: 4px; height: 9px; background: var(--flare-4); }
.more { width: 100%; margin-top: 6px; border: 1px dashed var(--rule); background: transparent; color: var(--ink-2); border-radius: 6px; padding: 6px; cursor: pointer; font-size: 12px; }
.more:hover { color: var(--ink); border-color: var(--ink-3); }
ol.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ol.rank button {
  width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) 90px 80px; align-items: center; gap: 8px;
  border: 0; border-radius: 6px; background: transparent; padding: 5px 6px; cursor: pointer; text-align: left;
}
ol.rank .spark svg { display: block; width: 100%; height: 26px; }
ol.rank button:hover, ol.rank button.on { background: var(--raise); }
ol.rank .i { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .n { min-width: 0; }
ol.rank .n b { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .n span { display: block; font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ol.rank .val { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
ol.rank .val small { display: block; font-size: 10px; color: var(--ink-3); white-space: nowrap; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: right; font-weight: 500; color: var(--ink-3); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 5px 6px; border-bottom: 1px solid var(--rule); text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--display); font-size: 12.5px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--raise); }
tr.click:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

.detail-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.detail-head h3 { margin: 0; font-size: 16px; font-stretch: 85%; font-weight: 700; }
.detail-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 12px; }
.close { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
.facts div { min-width: 0; }
.facts .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts .num { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts .unit { font-size: 10.5px; color: var(--ink-2); }
.subhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 11.5px; color: var(--ink-2); }
.subhead b { color: var(--ink); font-weight: 600; }
.subhead .nav { display: inline-flex; gap: 4px; }
.subhead .nav button { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 0 9px; height: 24px; cursor: pointer; color: var(--ink); }
.subhead .nav button:disabled { opacity: 0.35; cursor: default; }
.overview { cursor: ew-resize; touch-action: none; display: block; }
.passbox { min-height: 150px; }
.passbox .foot { padding: 50px 0; text-align: center; }
.note { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.note b { color: var(--ink); font-weight: 600; }
.chartkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.chartkey span { display: inline-flex; align-items: center; gap: 5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; }
a { color: var(--focus); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.copy { border: 1px solid var(--rule); background: transparent; color: var(--ink-2); border-radius: 5px; padding: 0 6px; cursor: pointer; font-size: 11px; }

.val-grid { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--flare-4); border-radius: 4px; }
.bar .pct2 { font-family: var(--mono); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .pct2 small { color: var(--ink-3); }

details.card summary { cursor: pointer; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); }
details.card ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; display: grid; gap: 5px; }
details.card li b { color: var(--ink); font-weight: 600; }
.foot { font-size: 11.5px; color: var(--ink-3); }

/* "How it works": a long-form reading view in the same night palette. */
.views .seg button { font-weight: 600; }
.explainer { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); }
.doc { max-width: 820px; margin: 0 auto; padding: 30px 24px 64px; font-size: 15.5px; line-height: 1.62; color: var(--ink); }
.doc > * { max-width: 100%; }
.doc h1 { font-size: 32px; font-stretch: 76%; font-weight: 760; margin: 0 0 16px; text-wrap: balance; }
.doc h2 {
  display: block; margin: 44px 0 14px; font-size: 25px; font-stretch: 80%; font-weight: 740; letter-spacing: 0.005em;
  text-transform: none; color: var(--flare-5); text-wrap: balance;
}
.doc h3 { margin: 32px 0 8px; font-size: 18px; font-stretch: 88%; font-weight: 700; text-wrap: balance; }
.doc p, .doc ul, .doc ol { margin: 0 0 14px; max-width: 68ch; }
.doc ul, .doc ol { padding-left: 22px; display: grid; gap: 6px; }
.doc strong { font-weight: 650; color: var(--ink); }
.doc em { color: var(--ink-2); }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0 8px; }
.doc a { color: var(--focus); }
.doc code { font-family: var(--mono); font-size: 0.88em; }
.doc figure { margin: 22px 0 8px; overflow-x: auto; }
.doc figure svg { display: block; width: 100%; height: auto; min-width: 540px; }
.doc figure.photo img { display: block; width: 100%; height: auto; min-width: 540px; border-radius: 10px; }
.doc .cap { font-size: 13px; color: var(--ink-2); margin: 0 0 22px; max-width: 76ch; }
.doc .cap em { color: inherit; font-style: normal; }
.doc .tbl-wrap { margin: 8px 0 18px; }
.doc table { font-size: 13.5px; }
.doc th, .doc td {
  text-align: left; font-family: var(--display); font-size: 13.5px; white-space: normal; vertical-align: top;
  padding: 7px 10px 7px 0; line-height: 1.45;
}
.doc th { color: var(--ink-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.doc td:first-child { font-family: var(--display); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .explainer { flex: none; overflow: visible; }
  .doc { padding: 22px 16px 48px; font-size: 15px; }
  .app { display: flex; flex-direction: column; }
  .mapwrap { height: 62vh; min-height: 340px; }
  .panel { overflow: visible; }
  h1 { font-size: 22px; }
}
@media (max-width: 420px) {
  .facts { grid-template-columns: 1fr 1fr; }
  ol.rank button { grid-template-columns: 22px minmax(0, 1fr) 60px 78px; gap: 6px; }
  .tl-hint { display: none; }
}
@media (max-width: 340px) {
  ol.rank button { grid-template-columns: 20px minmax(0, 1fr) 78px; }
  ol.rank .spark { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Nightly Offshore <span class="glow">Flaring</span></h1>
    <p class="sub" id="sub"></p>
  </div>
  <nav class="views" aria-label="View">
    <div class="seg" role="group">
      <button type="button" id="view-map" aria-pressed="true">Map</button>
      <button type="button" id="view-how" aria-pressed="false">How it works</button>
    </div>
  </nav>
  <div class="controls" id="controls">
    <div class="player">
      <button type="button" id="play" aria-pressed="false">▶ Play</button>
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Night timeline position">
    </div>
    <div class="seg" role="group" aria-label="Value shown">
      <button type="button" id="mode-mean" aria-pressed="true">Range mean</button>
      <button type="button" id="mode-night" aria-pressed="false">Single night</button>
    </div>
    <div class="seg" role="group" aria-label="Sites shown">
      <button type="button" id="show-all" aria-pressed="true">All sites</button>
      <button type="button" id="show-flaring" aria-pressed="false">Flaring only</button>
    </div>
    <label class="pct" for="pct">Hide below
      <input type="range" id="pct" min="0" max="100" step="1" value="0" aria-describedby="pct-out">
      <output id="pct-out" for="pct"></output>
    </label>
  </div>
</header>

<section class="timeline" id="timeline" aria-label="Night timeline">
  <div class="tl-head">
    <div class="tl-title">Radiant heat seen each night <span id="tl-sub"></span></div>
    <div class="tl-range"><span id="tl-range"></span><div class="seg sm" role="group" aria-label="Nights averaged" id="presets"></div></div>
  </div>
  <svg id="strip" tabindex="0" role="img" aria-label="Bar chart of total radiant heat per night. Click a night or drag to average a range; left and right arrow keys step through nights."></svg>
  <div class="tl-tip" id="tl-tip" hidden></div>
</section>

<main class="app">

<script type="application/json" id="flaring-data">__FLARING_DATA__</script>
<script type="application/json" id="basemap">__BASEMAP_TOPOJSON__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("flaring-data").textContent);
  const TOPO = JSON.parse(document.getElementById("basemap").textContent);
  const META = D.meta, NIGHTS = D.nights, NN = NIGHTS.length, SLOPE = META.bcm_per_mw_year;
  const CSS = getComputedStyle(document.documentElement);
  const C = {};
  ["sea", "land", "coast", "clear", "cloud", "focus", "ink", "ink-2", "ink-3", "rule", "raise", "panel",
   "flare-1", "flare-2", "flare-3", "flare-4", "flare-5", "flare-6"].forEach(k => {
    C[k] = CSS.getPropertyValue("--" + k).trim();
  });
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SVGNS = "http://www.w3.org/2000/svg";
  const MONO = "IBM Plex Mono, monospace";

  // ---------- data ----------
  // st: one code per night (F flaring, D lit through cloud, C clear no flare,
  // K cloudy, N not observed). rv: clear-sky MW for each F/D night in order.
  // cp: clear passes per night, one base-36 digit (sites that flared only).
  const S = D.sites.map(r => {
    const st = r[4], rv = r[5], rh = new Array(NN);
    let k = 0;
    for (let i = 0; i < NN; i++) {
      const ch = st[i];
      rh[i] = ch === "C" ? 0 : (ch === "F" || ch === "D") ? rv[k++] : null;
    }
    let cp = null;
    if (r[14]) { cp = new Uint8Array(NN); for (let i = 0; i < NN; i++) cp[i] = parseInt(r[14][i], 36); }
    return {
      id: r[0], lat: r[1], lon: r[2], nstruct: r[3], st, rh, tmax: r[6], mean: r[7],
      region: r[8], mycRegime: r[9], mycBcm: r[10], mycIso: r[11], mycClass: r[12], structs: r[13], cp,
      max: d3.max(rh) || 0,
    };
  });
  S.forEach(s => { s.name = s.region + (s.mycIso ? " · " + s.mycIso : ""); });

  // Nightly totals for the timeline (all sites, independent of filters).
  const NIGHT_TOT = NIGHTS.map((n, i) => {
    let mw = 0, nf = 0, nc = 0, no = 0;
    for (const s of S) {
      const ch = s.st[i];
      if (ch !== "N") no++;
      if (ch === "F") { mw += s.rh[i] || 0; nf++; nc++; } else if (ch === "C") nc++;
    }
    return { mw, nf, nc, no };
  });
  // A night is partial when far fewer sites were passed over than usual
  // (satellite files missing at either end of the archive).
  const OBS_TYPICAL = d3.median(NIGHT_TOT, d => d.no) || 1;
  NIGHT_TOT.forEach(d => { d.partial = d.no < 0.9 * OBS_TYPICAL; });

  const RANK_PAGE = window.matchMedia("(max-width: 900px)").matches ? 10 : 25;
  const state = {
    night: -1, range: [0, NN - 1], flaringOnly: false, selected: null, hover: null, hl: null,
    pct: 0, thr: null, nFl: 0, animT: null, sort: "strong", rankN: RANK_PAGE, win: null, winManual: false,
  };

  // Lower end of the 95% Wilson interval for k successes in n trials.
  function wilsonLo(k, n) {
    if (!n) return 0;
    const z = 1.96, z2 = z * z, p = k / n;
    return (p + z2 / (2 * n) - z * Math.sqrt(p * (1 - p) / n + z2 / (4 * n * n))) / (1 + z2 / n);
  }
  // Per-site stats over the selected range (mean counts clear no-flare nights as 0).
  function computeRange() {
    const [a, b] = state.range;
    for (const s of S) {
      let sum = 0, nC = 0, nF = 0, nO = 0, nD = 0, nP = 0;
      for (let i = a; i <= b; i++) {
        const ch = s.st[i];
        if (ch === "F") { sum += s.rh[i] || 0; nC++; nF++; nO++; }
        else if (ch === "C") { nC++; nO++; }
        else if (ch === "K") nO++;
        else if (ch === "D") { nD++; nO++; if (s.rh[i] != null) { nC++; sum += s.rh[i]; } }
        if (s.cp) nP += s.cp[i];
      }
      s.rFlare = nF; s.rClear = nC; s.rObs = nO; s.rCloudFlare = nD; s.rMean = nC ? sum / nC : null;
      s.rPasses = nP; s.rShare = nC ? nF / nC : 0; s.rLo = wilsonLo(nF, nC);
    }
  }
  // F flaring (clear sky), D seen lit through cloud, C clear no flare, K cloudy, N not observed
  function statusOf(s) {
    if (state.night < 0) return s.rFlare ? "F" : s.rCloudFlare ? "D" : s.rClear ? "C" : s.rObs ? "K" : "N";
    return s.st[state.night];
  }
  function valueOf(s) {
    if (state.night < 0) return s.rFlare ? s.rMean : null;
    return s.st[state.night] === "F" ? s.rh[state.night] : null;
  }
  function computeThreshold() {
    const vals = S.filter(s => statusOf(s) === "F").map(valueOf).sort(d3.ascending);
    state.nFl = vals.length;
    state.thr = state.pct > 0 && vals.length ? d3.quantileSorted(vals, state.pct / 100) : null;
  }
  function visible(s) {
    const st = statusOf(s);
    if (st === "N") return false;
    if (state.flaringOnly && st !== "F" && st !== "D") return false;
    if (state.thr != null) return st === "F" && valueOf(s) >= state.thr;
    return true;
  }
  // Animation frame at fractional night t: ease between adjacent nights; cloudy
  // or unobserved nights hold the neighbouring clear value at low opacity.
  const nightVal = (s, n) => s.st[n] === "F" ? s.rh[n] : s.st[n] === "C" ? 0 : null;
  function frameValue(s, t) {
    const tt = Math.max(0, Math.min(t, NN - 1));
    const i = Math.floor(tt), j = Math.min(i + 1, NN - 1), f = tt - i, k = Math.round(tt);
    let a = nightVal(s, i), b = nightVal(s, j);
    if (a == null && b == null) return { st: s.st[k], v: null, alpha: 1 };
    if (a == null) a = b;
    if (b == null) b = a;
    const e = reduceMotion ? (f < 0.5 ? 0 : 1) : f * f * (3 - 2 * f);
    const known = s.st[k] === "F" || s.st[k] === "C";
    return { st: s.st[k], v: a + (b - a) * e, alpha: known ? 1 : 0.32 };
  }

  // ---------- formatting ----------
  const fmtMW = v => v == null ? "–" : v === 0 ? "0" : v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
  const fmtInt = d3.format(",");
  const mcm = mw => mw * SLOPE * 1000; // million m3 per year
  const fmtMcm = v => v >= 100 ? d3.format(",.0f")(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  const dateOf = iso => new Date(iso + "T00:00:00Z");
  const wd = iso => dateOf(iso).toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  const md = iso => dateOf(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const rangeLabel = (a, b) => a === b ? md(NIGHTS[a]) : md(NIGHTS[a]) + " – " + md(NIGHTS[b]);
  const isFull = () => state.range[0] === 0 && state.range[1] === NN - 1;
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) e.append(k);
    return e;
  }
  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  }
  function svgText(x, y, str, attrs) {
    const t = svg("text", Object.assign({ x, y, fill: C["ink-3"], "font-size": 10, "font-family": MONO }, attrs || {}));
    t.textContent = str;
    return t;
  }
  const cross = (cx, cy, r, color) => svg("path", {
    d: `M${cx - r},${cy - r}L${cx + r},${cy + r}M${cx + r},${cy - r}L${cx - r},${cy + r}`, stroke: color, "stroke-width": 1.3,
  });

  // ---------- colour & size ----------
  const ramp = d3.interpolateRgbBasis([C["flare-2"], C["flare-3"], C["flare-4"], C["flare-5"], C["flare-6"]]);
  const tScale = d3.scaleLog().domain([0.05, 60]).range([0, 1]).clamp(true);
  const colorOf = v => ramp(tScale(Math.max(v, 0.05)));
  const radiusOf = v => Math.min(2.4 + 2.3 * Math.sqrt(Math.max(v, 0)), 22);

  // ---------- header ----------
  document.getElementById("sub").append(
    "VIIRS night passes over ", el("b", { text: fmtInt(META.n_sites) }), " GFW offshore oil sites · ",
    el("b", { text: rangeLabel(0, NN - 1) + ", " + dateOf(NIGHTS[NN - 1]).getUTCFullYear() }),
    " · " + NN + " nights, one value per site per night",
    META.status ? el("span", { class: "pill", title: META.status, text: META.status_label || "draft" }) : null);

  // ---------- map ----------
  const wrap = document.getElementById("mapwrap");
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const proj = d3.geoMercator().scale(256 / (2 * Math.PI)).translate([128, 128]).precision(0.1);
  const countries = topojson.feature(TOPO, TOPO.objects.countries);
  const gpath = d3.geoPath(proj);
  const landP = new Path2D(gpath(countries));
  const borderP = new Path2D(gpath(topojson.mesh(TOPO, TOPO.objects.countries, (a, b) => a !== b)));
  const coastP = new Path2D(gpath(topojson.mesh(TOPO, TOPO.objects.countries, (a, b) => a === b)));
  S.forEach(s => { const p = proj([s.lon, s.lat]); s.px = p[0]; s.py = p[1]; });

  let W = 0, H = 0, dpr = 1, T = d3.zoomIdentity, quad = null, kWorld = 1;
  const zoom = d3.zoom().scaleExtent([1, 4000]).on("zoom", e => { T = e.transform; draw(); hideTip(); })
    .on("start", () => canvas.classList.add("dragging")).on("end", () => canvas.classList.remove("dragging"));
  const csel = d3.select(canvas).call(zoom).on("dblclick.zoom", null);

  function fit(x0, y0, x1, y1, pad) {
    pad = pad == null ? 0.08 : pad;
    const k = Math.min(W / ((x1 - x0) * (1 + 2 * pad)), H / ((y1 - y0) * (1 + 2 * pad)));
    return d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k);
  }
  function worldView() {
    const obs = S.filter(s => s.st.replace(/N/g, "").length);
    const xs = d3.extent(obs, s => s.px), ys = d3.extent(obs, s => s.py);
    return fit(xs[0], ys[0], xs[1], ys[1], 0.05);
  }
  function go(t, ms) {
    csel.transition().duration(reduceMotion ? 0 : (ms == null ? 650 : ms)).call(zoom.transform, t);
  }
  function resize() {
    const r = wrap.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return; // hidden behind "How it works"
    const first = W === 0;
    const cx = W ? T.invertX(W / 2) : 0, cy = H ? T.invertY(H / 2) : 0;
    W = Math.max(r.width, 10); H = Math.max(r.height, 10); dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    kWorld = Math.min(W, H) / 256;
    zoom.scaleExtent([kWorld * 0.9, kWorld * 6000]).translateExtent([[-40, -10], [296, 266]]);
    if (first) { T = worldView(); csel.call(zoom.transform, T); }
    else { csel.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - T.k * cx, H / 2 - T.k * cy).scale(T.k)); }
    draw();
  }

  function draw() {
    if (!W) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.sea; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(T.x, T.y); ctx.scale(T.k, T.k);
    ctx.fillStyle = C.land; ctx.fill(landP);
    ctx.lineWidth = 0.8 / T.k; ctx.strokeStyle = C.coast; ctx.stroke(coastP);
    ctx.lineWidth = 0.6 / T.k; ctx.setLineDash([2 / T.k, 2 / T.k]); ctx.stroke(borderP); ctx.setLineDash([]);
    ctx.restore();

    const pts = [], flares = [], rings = [];
    const dot = Math.min(1.3 + 0.25 * Math.log2(Math.max(T.k / kWorld, 1)), 3.2);
    for (const s of S) {
      let st, v, alpha = 1;
      if (state.animT != null) {
        const fv = frameValue(s, state.animT);
        v = fv.v; alpha = fv.alpha; st = fv.st;
        const lit = v != null && v > 0.01;
        if (lit) {
          if (state.thr != null && v < state.thr) continue;
          st = "F";
        } else {
          if (st === "N" || state.thr != null) continue;
          if (state.flaringOnly && st !== "D") continue;
          if (st === "F") st = "C";
        }
      } else {
        if (!visible(s)) continue;
        st = statusOf(s); v = valueOf(s);
      }
      const x = T.applyX(s.px), y = T.applyY(s.py);
      if (x < -30 || y < -30 || x > W + 30 || y > H + 30) continue;
      pts.push([x, y, s]);
      if (st === "F") { flares.push([x, y, s, v, alpha]); continue; }
      if (st === "D") { rings.push([x, y]); continue; }
      ctx.fillStyle = st === "C" ? C.clear : C.cloud;
      ctx.beginPath(); ctx.arc(x, y, dot, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.lineWidth = 1.3; ctx.strokeStyle = C["flare-4"];
    for (const [x, y] of rings) { ctx.beginPath(); ctx.arc(x, y, dot + 2.2, 0, 2 * Math.PI); ctx.stroke(); }
    flares.sort((a, b) => a[3] - b[3]);
    ctx.globalCompositeOperation = "lighter";
    for (const [x, y, , v, alpha] of flares) {
      const r = radiusOf(v) * 2.6, c = d3.color(colorOf(v));
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      c.opacity = 0.42 * alpha; g.addColorStop(0, c.formatRgb());
      c.opacity = 0; g.addColorStop(1, c.formatRgb());
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(9,16,23,0.9)";
    for (const [x, y, , v, alpha] of flares) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = colorOf(v);
      ctx.beginPath(); ctx.arc(x, y, radiusOf(v), 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const s of [state.selected, state.hl, state.hover]) {
      if (!s) continue;
      const x = T.applyX(s.px), y = T.applyY(s.py), v = valueOf(s);
      const r = (v != null ? radiusOf(v) : dot) + 4;
      ctx.lineWidth = s === state.selected ? 2 : 1.5; ctx.strokeStyle = C.focus;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.stroke();
    }
    quad = d3.quadtree().x(d => d[0]).y(d => d[1]).addAll(pts);
  }

  // ---------- night chart (whole period, one column per night) ----------
  // Columns: that night's clear-sky radiant heat, relative to the site's maximum.
  // Baseline strip: the night's status, so presence and gaps read at any width.
  // When nights outnumber pixels, adjacent nights share a column (mean value,
  // strongest status).
  const ST_RANK = { N: 0, K: 1, C: 2, D: 3, F: 4 };
  const stColor = ch => ch === "F" ? C["flare-5"] : ch === "D" ? C["flare-2"] : ch === "C" ? C.clear : ch === "K" ? C.cloud : null;
  function nightChart(s, w, h, opts) {
    opts = opts || {};
    const padX = opts.padX != null ? opts.padX : 1, top = opts.axis ? 15 : 1, bot = opts.axis ? 14 : 0;
    const base = opts.base || 3, gapB = 1, ph = h - top - bot - base - gapB;
    const innerW = w - 2 * padX, minPx = opts.minPx || 1;
    const per = Math.max(1, Math.ceil(NN / Math.max(1, Math.floor(innerW / minPx))));
    const nb = Math.ceil(NN / per), cw = innerW / nb;
    const bin = i => Math.floor(i / per), xb = b => padX + b * cw;
    const max = Math.max(s.max || 0, 0.1);
    const root = svg("svg", { width: w, height: h, viewBox: `0 0 ${w} ${h}`, "aria-hidden": "true" });
    if (opts.stretch) root.setAttribute("preserveAspectRatio", "none");
    if (!isFull()) {
      const a = xb(bin(state.range[0])), b = xb(bin(state.range[1]) + 1);
      root.append(svg("rect", { x: a, y: top - 1, width: b - a, height: ph + base + gapB + 2, fill: C.focus, opacity: 0.1 }));
    }
    let pBar = "";
    const pSt = { F: "", D: "", C: "", K: "" };
    const yBase = top + ph + gapB, bw = cw >= 2.5 ? cw - 0.8 : cw;
    for (let b = 0; b < nb; b++) {
      let sum = 0, n = 0, best = "N";
      for (let i = b * per, e = Math.min(NN, (b + 1) * per); i < e; i++) {
        const ch = s.st[i], v = s.rh[i];
        if (v != null) { sum += v; n++; }
        if (ST_RANK[ch] > ST_RANK[best]) best = ch;
      }
      const x0 = xb(b);
      if (n && sum > 0) {
        const bh = Math.max(1, (sum / n) / max * ph);
        pBar += `M${x0.toFixed(2)},${top + ph}h${bw.toFixed(2)}v${(-bh).toFixed(2)}h${(-bw).toFixed(2)}z`;
      }
      if (best !== "N") pSt[best] += `M${x0.toFixed(2)},${yBase}h${bw.toFixed(2)}v${base}h${(-bw).toFixed(2)}z`;
    }
    if (pBar) root.append(svg("path", { d: pBar, fill: C["flare-4"], opacity: 0.92 }));
    for (const ch of ["K", "C", "D", "F"]) if (pSt[ch]) root.append(svg("path", { d: pSt[ch], fill: stColor(ch) }));
    if (state.night >= 0) {
      const xc = xb(bin(state.night)) + bw / 2;
      root.append(svg("line", { x1: xc, x2: xc, y1: top - 1, y2: yBase + base + 1, stroke: C.focus, "stroke-width": 1, opacity: 0.85 }));
    }
    if (opts.axis) {
      root.append(svgText(padX, h - 3, md(NIGHTS[0]), { "text-anchor": "start" }));
      root.append(svgText(w - padX, h - 3, md(NIGHTS[NN - 1]), { "text-anchor": "end" }));
      root.append(svgText(padX, 1, "max " + fmtMW(max) + " MW", { "dominant-baseline": "hanging" }));
    }
    if (opts.win) {
      const wr = svg("rect", { y: top - 2, height: ph + base + gapB + 3, rx: 2, fill: C.focus, "fill-opacity": 0.1, stroke: C.focus, "stroke-width": 1.3 });
      root.append(wr);
      root.setWin = ([a, b]) => {
        const x0 = xb(bin(a)), x1 = xb(bin(b) + 1);
        wr.setAttribute("x", x0 - 0.5); wr.setAttribute("width", Math.max(x1 - x0 + 1, 3));
      };
      root.setWin(opts.win);
    }
    root.nightAt = px => Math.max(0, Math.min(NN - 1, Math.floor((px - padX) / cw) * per + Math.floor(per / 2)));
    return root;
  }
  // Legend for the night charts, built once per container.
  function microKey(box) {
    box.replaceChildren();
    const item = (cls, color, label) => {
      const i = el("i", { class: cls });
      if (color) i.style.background = color;
      box.append(el("span", null, i, label));
    };
    item("bar", null, "nightly heat");
    item("", C["flare-5"], "flaring");
    item("", C["flare-2"], "lit through cloud");
    item("", C.clear, "clear, no flare");
    item("", C.cloud, "cloudy");
  }

  // ---------- map tooltip ----------
  const tip = document.getElementById("tip");
  function hideTip() { tip.hidden = true; if (state.hover) { state.hover = null; draw(); } }
  function siteFacts(s) {
    const dl = el("dl");
    const add = (k, v) => dl.append(el("dt", { text: k }), el("dd", { text: v }));

  // ---------- views: map / how it works (#how-it-works) ----------
  const views = {
    map: [document.getElementById("timeline"), document.querySelector("main.app"), document.getElementById("controls")],
    how: [document.getElementById("explainer")],
  };
  const viewBtn = { map: document.getElementById("view-map"), how: document.getElementById("view-how") };
  function setView(name, push) {
    for (const [k, els] of Object.entries(views)) {
      els.forEach(e => { e.hidden = k !== name; });
      viewBtn[k].setAttribute("aria-pressed", String(k === name));
    }
    if (name === "how") pause();
    if (push) {
      const h = name === "how" ? "#how-it-works" : "#map";
      if (location.hash !== h) history.replaceState(null, "", h);
    }
  }
  const viewFromHash = () => (location.hash === "#how-it-works" ? "how" : "map");
  viewBtn.map.addEventListener("click", () => setView("map", true));
  viewBtn.how.addEventListener("click", () => { setView("how", true); document.getElementById("explainer").scrollTop = 0; });
  window.addEventListener("hashchange", () => setView(viewFromHash(), false));

  computeRange();
  renderValidation();
  renderMethod();
  setView(viewFromHash(), false);
  new ResizeObserver(() => { renderStrip(); }).observe(tlBox);
  new ResizeObserver(resize).observe(wrap);
  renderStrip();
  refresh();
})();
</script>
</body>
</html>
