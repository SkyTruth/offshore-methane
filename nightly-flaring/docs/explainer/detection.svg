-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-weight="400" transform="rotate(-90 16 142.0)">1.6 µm radiance</text><text x="70.0" y="300.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">A pixel becomes a candidate when it clears the line; it is confirmed when another band also shows heat,</text><text x="70.0" y="316.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">which rules out particle hits on the detector. Only the brightest pixel of a hot patch counts as a flare peak.</text></svg>
