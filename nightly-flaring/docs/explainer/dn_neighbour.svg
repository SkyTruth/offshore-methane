<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-label="Source 3780 and neighbour 3779-3781 on 1 Oct 2026, to scale"><title>Source 3780 and neighbour 3779-3781 on 1 Oct 2026, to scale</title><rect width="760" height="412" rx="12" fill="#00131F"/><text x="20.0" y="24.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">Two sources 1.3 km apart: whose flare was seen?</text><text x="20.0" y="42.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Source 3780 and its neighbour 3779-3781, night of 1 Oct 2026, to scale</text><circle cx="250.0" cy="205.0" r="70.0" fill="none" stroke="#60869F" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="250.0" cy="205.0" r="105.0" fill="none" stroke="#9FC6BA" stroke-width="1.4"/><line x1="40.0" y1="364.0" x2="64.0" y2="364.0" stroke="#9FC6BA" stroke-width="1.4"/><text x="72.0" y="368.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">1.5 km: any detection inside means 3780 was not dark</text><line x1="40.0" y1="382.0" x2="64.0" y2="382.0" stroke="#60869F" stroke-width="1.4" stroke-dasharray="4 3"/><text x="72.0" y="386.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">1 km: detections inside count toward its burning rate</text><circle cx="250.0" cy="205.0" r="6" fill="#F9F6F3" stroke="#00131F" stroke-width="2"/><text x="240.0" y="227.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="end" font-weight="650" stroke="#00131F" stroke-width="4" paint-order="stroke">3780</text><circle cx="244.9" cy="115.5" r="6" fill="#9CB7C9" stroke="#00131F" stroke-width="2"/><text x="254.9" y="119.5" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650" stroke="#00131F" stroke-width="4" paint-order="stroke">3779-3781</text><circle cx="225.6" cy="92.1" r="9" fill="#FD8E28" stroke="#00131F" stroke-width="1" opacity="0.9"><title>NOAA-21 2026-10-01T22:03:07: 1,658 m from 3780, 64 MW</title></circle><circle cx="259.2" cy="99.8" r="9" fill="#FD8E28" stroke="#00131F" stroke-width="1" opacity="0.9"><title>SNPP 2026-10-01T22:39:50: 1,517 m from 3780, 71 MW</title></circle><circle cx="225.8" cy="96.5" r="8.463427722037611" fill="#FD8E28" stroke="#00131F" stroke-width="1" opacity="0.9"><title>NOAA-20 2026-10-01T22:59:18: 1,596 m from 3780, 47 MW</title></circle><line x1="250.0" y1="328.0" x2="320.0" y2="328.0" stroke="#9CB7C9" stroke-width="2"/><text x="285.0" y="344.0" fill="#9CB7C9" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">1 km</text><rect x="458.0" y="64.0" width="282.0" height="254.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="470.0" y="88.0" fill="#F9F6F3" font-size="12.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">What the record shows</text><text x="470.0" y="110.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">The two source centres are 1,287 m apart.</text><text x="470.0" y="125.5" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">That night 3 detections fell 1,517–1,658 m</text><text x="470.0" y="141.1" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">from 3780: just outside its 1.5 km circle,</text><text x="470.0" y="156.6" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">so 3780 counts as dark.</text><text x="470.0" y="172.1" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400"></text><text x="470.0" y="187.6" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">They lie nearest 3779-3781, which burned</text><text x="470.0" y="203.2" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">at 47–71 MW. Where a detection lands</text><text x="470.0" y="218.7" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">shifts from pass to pass, so the record</text><text x="470.0" y="234.2" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">cannot say which source was burning.</text><text x="470.0" y="249.7" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400"></text><text x="470.0" y="265.2" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Rule: a dark night is not listed when</text><text x="470.0" y="280.8" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">another source within 1.5 km had its own</text><text x="470.0" y="296.3" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">detection that night.</text></svg>
