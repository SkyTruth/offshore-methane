<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" role="img" aria-label="Six steps from a satellite pass to an annual gas volume"><title>Six steps from a satellite pass to an annual gas volume</title><rect width="760" height="314" rx="12" fill="#0b141c"/><rect x="20.0" y="22.0" width="220.0" height="118.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><circle cx="42.0" cy="48.0" r="13" fill="#923f13"/><text x="42.0" y="53.0" fill="#0b141c" font-size="13" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">1</text><text x="64.0" y="53.0" fill="#e3e9ee" font-size="15" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="650">Night pass</text><text x="36.0" y="82.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">VIIRS scans the sea around</text><text x="36.0" y="98.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">01:45 local time in 750 m</text><text x="36.0" y="115.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">pixels, three satellites.</text><line x1="244.0" y1="81.0" x2="266.0" y2="81.0" stroke="#66747f" stroke-width="1.5"/><path d="M259.7,84.0 L266.0,81.0 L259.7,78.0" stroke="#66747f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="270.0" y="22.0" width="220.0" height="118.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><circle cx="292.0" cy="48.0" r="13" fill="#c95d18"/><text x="292.0" y="53.0" fill="#0b141c" font-size="13" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">2</text><text x="314.0" y="53.0" fill="#e3e9ee" font-size="15" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="650">Find hot pixels</text><text x="286.0" y="82.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">A pixel glows at 1.6 µm far</text><text x="286.0" y="98.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">above the dark sea around it,</text><text x="286.0" y="115.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">and a second band agrees.</text><line x1="494.0" y1="81.0" x2="516.0" y2="81.0" stroke="#66747f" stroke-width="1.5"/><path d="M509.7,84.0 L516.0,81.0 L509.7,78.0" stroke="#66747f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="22.0" width="220.0" height="118.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><circle cx="542.0" cy="48.0" r="13" fill="#f28d27"/><text x="542.0" y="53.0" fill="#0b141c" font-size="13" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">3</text><text x="564.0" y="53.0" fill="#e3e9ee" font-size="15" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="650">Read the colours</text><text x="536.0" y="82.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">Brightness in up to six</text><text x="536.0" y="98.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">infrared bands, 0.9–4 µm,</text><text x="536.0" y="115.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">traces the flame&#x27;s spectrum.</text><rect x="20.0" y="174.0" width="220.0" height="118.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><circle cx="42.0" cy="200.0" r="13" fill="#ffbc5f"/><text x="42.0" y="205.0" fill="#0b141c" font-size="13" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">4</text><text x="64.0" y="205.0" fill="#e3e9ee" font-size="15" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="650">Fit a hot body</text><text x="36.0" y="234.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">The spectrum&#x27;s shape gives</text><text x="36.0" y="250.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">temperature (about 1,750 K);</text><text x="36.0" y="267.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">its height gives flame area.</text><line x1="244.0" y1="233.0" x2="266.0" y2="233.0" stroke="#66747f" stroke-width="1.5"/><path d="M259.7,236.0 L266.0,233.0 L259.7,230.0" stroke="#66747f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="270.0" y="174.0" width="220.0" height="118.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><circle cx="292.0" cy="200.0" r="13" fill="#ffe4b0"/><text x="292.0" y="205.0" fill="#0b141c" font-size="13" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">5</text><text x="314.0" y="205.0" fill="#e3e9ee" font-size="15" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="650">Radiant heat</text><text x="286.0" y="234.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">Area × σT⁴ = megawatts</text><text x="286.0" y="250.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">of heat leaving the flame</text><text x="286.0" y="267.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">during that pass.</text><line x1="494.0" y1="233.0" x2="516.0" y2="233.0" stroke="#66747f" stroke-width="1.5"/><path d="M509.7,236.0 L516.0,233.0 L509.7,230.0" stroke="#66747f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="520.0" y="174.0" width="220.0" height="118.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><circle cx="542.0" cy="200.0" r="13" fill="#ffbc5f"/><text x="542.0" y="205.0" fill="#0b141c" font-size="13" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="700">6</text><text x="564.0" y="205.0" fill="#e3e9ee" font-size="15" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="650">Average, convert</text><text x="536.0" y="234.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">Mean over clear passes, with</text><text x="536.0" y="250.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">unlit passes as zero, × 0.0116</text><text x="536.0" y="267.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">gives billion m³ of gas a year.</text><path d="M630.0,142.0 L630.0,157.0 L130.0,157.0 L130.0,168.0" stroke="#66747f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="130.0" y1="162.0" x2="130.0" y2="172.0" stroke="#66747f" stroke-width="1.5"/><path d="M127.0,165.7 L130.0,172.0 L133.0,165.7" stroke="#66747f" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
