ont-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">Impossible fits removed</text><rect x="675.2" y="62.0" width="35.5" height="16.0" fill="#4a6a80" rx="2"/><text x="669.2" y="73.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">-5,917</text><text x="240.0" y="103.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">Double counts removed</text><rect x="652.5" y="92.0" width="22.7" height="16.0" fill="#4a6a80" rx="2"/><text x="646.5" y="103.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">-3,783</text><text x="240.0" y="133.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">Distant pixels no longer summed</text><rect x="634.4" y="122.0" width="18.1" height="16.0" fill="#4a6a80" rx="2"/><text x="628.4" y="133.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">-3,010</text><text x="240.0" y="163.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">Bow-tie copies averaged</text><rect x="622.6" y="152.0" width="11.9" height="16.0" fill="#4a6a80" rx="2"/><text x="616.6" y="163.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">-1,981</text><text x="240.0" y="193.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">Moved or dropped at 2 km</text><rect x="614.2" y="182.0" width="8.4" height="16.0" fill="#4a6a80" rx="2"/><text x="608.2" y="193.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">-1,397</text><text x="240.0" y="223.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">Splits and refits</text><rect x="612.6" y="212.0" width="2.0" height="16.0" fill="#4a6a80" rx="2"/><text x="606.6" y="223.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">-263</text><text x="240.0" y="253.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="400">New detections</text><rect x="612.6" y="242.0" width="4.3" height="16.0" fill="#7ad5e9" rx="2"/><text x="606.6" y="253.0" fill="#9aa8b4" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="400">+719</text><text x="240.0" y="283.0" fill="#e3e9ee" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="end" font-weight="650">v5 total</text><rect x="250.0" y="270.0" width="366.9" height="20.0" fill="#f28d27" rx="3"/><text x="608.9" y="283.0" fill="#0b141c" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="end" font-weight="600">61,153 MW</text><text x="30.0" y="338.0" fill="#66747f" font-size="12" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">Radiant heat summed over every detection in each 30-night run. 81% of the drop removes v3 errors.</text></svg>
