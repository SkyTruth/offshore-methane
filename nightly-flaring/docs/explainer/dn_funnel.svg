<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="From every clear dark night to the single dark nights list"><title>From every clear dark night to the single dark nights list</title><rect width="760" height="392" rx="12" fill="#00131F"/><text x="20.0" y="24.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">From every clear dark night to the list</text><text x="20.0" y="61.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Clear dark nights at every source</text><rect x="330.0" y="49.0" width="359.9" height="18.0" fill="#60869F" rx="3"/><text x="697.9" y="62.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">11,670</text><text x="38.0" y="95.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">A neighbour within 1.5 km was detected that night</text><rect x="330.0" y="83.0" width="139.8" height="18.0" fill="#002640" rx="3"/><text x="477.8" y="96.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">38 left out</text><text x="38.0" y="129.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Fewer than 10 other clear nights within 14 nights</text><rect x="330.0" y="117.0" width="272.5" height="18.0" fill="#002640" rx="3"/><text x="610.5" y="130.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">1,201 left out</text><text x="38.0" y="163.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Flare seen on half or fewer of them</text><rect x="330.0" y="151.0" width="350.1" height="18.0" fill="#002640" rx="3"/><text x="688.1" y="164.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">9,034 left out</text><text x="38.0" y="197.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">No lit night before the run</text><rect x="330.0" y="185.0" width="135.5" height="18.0" fill="#002640" rx="3"/><text x="473.5" y="198.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">34 left out</text><text x="20.0" y="231.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Listed: usually burning, then dark</text><rect x="330.0" y="219.0" width="277.4" height="18.0" fill="#FD8E28" rx="3"/><text x="615.4" y="232.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">1,363</text><text x="38.0" y="265.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">with an EMIT scene within two nights</text><rect x="330.0" y="253.0" width="169.4" height="18.0" fill="#9FC6BA" rx="3"/><text x="507.4" y="266.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">82</text><text x="38.0" y="299.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">with EMIT images covering the source</text><rect x="330.0" y="287.0" width="79.9" height="18.0" fill="#9FC6BA" rx="3"/><text x="417.9" y="300.0" fill="#F9F6F3" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">8</text><line x1="330.0" y1="46.0" x2="330.0" y2="320.0" stroke="#043352" stroke-width="1"/><text x="330.0" y="334.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">1</text><line x1="418.5" y1="46.0" x2="418.5" y2="320.0" stroke="#043352" stroke-width="1"/><text x="418.5" y="334.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">10</text><line x1="507.0" y1="46.0" x2="507.0" y2="320.0" stroke="#043352" stroke-width="1"/><text x="507.0" y="334.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">100</text><line x1="595.5" y1="46.0" x2="595.5" y2="320.0" stroke="#043352" stroke-width="1"/><text x="595.5" y="334.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">1,000</text><line x1="684.0" y1="46.0" x2="684.0" y2="320.0" stroke="#043352" stroke-width="1"/><text x="684.0" y="334.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">10,000</text><text x="330.0" y="352.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">nights (log scale)</text><text x="20.0" y="374.0" fill="#60869F" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Rules are applied in this order; each night is counted at the first rule it fails. 88 nights, 187 listed sources.</text></svg>
