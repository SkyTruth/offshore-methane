<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" role="img" aria-label="Radiant heat from temperature and flame area, with typical values"><title>Radiant heat from temperature and flame area, with typical values</title><rect width="760" height="264" rx="12" fill="#0b141c"/><text x="380.0" y="46.0" fill="#e3e9ee" font-size="20" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-weight="650">radiant heat  =  flame area  ×  σ  ×  temperature⁴</text><text x="380.0" y="74.0" fill="#66747f" font-size="12" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle" font-weight="400">σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴ (Stefan–Boltzmann constant)</text><rect x="30.0" y="100.0" width="222.0" height="112.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><text x="46.0" y="124.0" fill="#66747f" font-size="11" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400" letter-spacing="0.08em">TEMPERATURE</text><text x="46.0" y="162.0" fill="#e3e9ee" font-size="26" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="start" font-weight="600">1,747 K</text><text x="46.0" y="192.0" fill="#9aa8b4" font-size="11.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="start" font-weight="400">5th–95th pct 1,488–2,109</text><rect x="269.0" y="100.0" width="222.0" height="112.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><text x="285.0" y="124.0" fill="#66747f" font-size="11" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400" letter-spacing="0.08em">FLAME AREA</text><text x="285.0" y="162.0" fill="#e3e9ee" font-size="26" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="start" font-weight="600">2.2 m²</text><text x="285.0" y="192.0" fill="#9aa8b4" font-size="11.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="start" font-weight="400">5th–95th pct 0.3–61.2</text><rect x="508.0" y="100.0" width="222.0" height="112.0" fill="#0e1821" stroke="#1e2c39" stroke-width="1" rx="10"/><text x="524.0" y="124.0" fill="#66747f" font-size="11" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400" letter-spacing="0.08em">RADIANT HEAT PER PASS</text><text x="524.0" y="162.0" fill="#ffbc5f" font-size="26" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="start" font-weight="600">1.19 MW</text><text x="524.0" y="192.0" fill="#9aa8b4" font-size="11.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="start" font-weight="400">5th–95th pct 0.25–29</text><text x="380.0" y="244.0" fill="#66747f" font-size="12" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-weight="400">Typical values over 34,087 detections, 88 nights (v5). One megawatt is the output of about 400 electric space heaters.</text></svg>
