" font-size="12" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">apparent flame area vs. straight down</text><text x="30.0" y="300.0" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">Flames are taller than wide (published H/R 1–4, mean 1.6), so a satellite near the swath edge sees more flame.</text><text x="30.0" y="316.9" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">Measured at 39 persistent flares over 88 nights: edge passes read 1.58× nadir passes (median);</text><text x="30.0" y="333.8" fill="#9aa8b4" font-size="12.5" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="start" font-weight="400">H/R 1.6 predicts 1.36. EOG&#x27;s calibration does not correct for this, and neither does this pipeline.</text></svg>
