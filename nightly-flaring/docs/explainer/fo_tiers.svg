<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628" width="760" height="628" role="img" aria-label="How a dark spell becomes a High, Mid or Watch card"><title>How a dark spell becomes a High, Mid or Watch card</title><rect width="760" height="628" rx="12" fill="#00131F"/><rect x="20.0" y="18.0" width="720.0" height="62.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="34.0" y="40.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">A dark spell</text><text x="34.0" y="59.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Nights after the source was last seen, until it is seen again; a detection through cloud also ends it.</text><text x="34.0" y="74.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Only clear nights count as dark. Cloud-only nights are skipped, not counted.</text><line x1="190.0" y1="82.0" x2="190.0" y2="102.0" stroke="#60869F" stroke-width="1.5"/><path d="M187.0,95.7 L190.0,102.0 L193.0,95.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="20.0" y="104.0" width="340.0" height="82.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="34.0" y="126.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">Enough clear evidence?</text><text x="34.0" y="145.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">6 or more clear nights with no flare seen,</text><text x="34.0" y="160.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">from 2 or more satellites, and heat measured</text><text x="34.0" y="176.7" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">just before the spell (3+ clear detections)</text><line x1="362.0" y1="145.0" x2="396.0" y2="145.0" stroke="#60869F" stroke-width="1.5"/><path d="M389.7,148.0 L396.0,145.0 L389.7,142.0" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="370.0" y="138.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">no</text><rect x="400.0" y="125.0" width="200.0" height="40.0" fill="#00131F" stroke="#043352" stroke-width="1" rx="8" stroke-dasharray="4 3"/><text x="500.0" y="149.0" fill="#60869F" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">no card</text><line x1="190.0" y1="188.0" x2="190.0" y2="208.0" stroke="#60869F" stroke-width="1.5"/><path d="M187.0,201.7 L190.0,208.0 L193.0,201.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="198.0" y="202.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">yes</text><rect x="20.0" y="210.0" width="340.0" height="64.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="34.0" y="232.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">Clear of nearby heat?</text><text x="34.0" y="251.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">No hot cluster within 3 km of the source</text><text x="34.0" y="266.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">during the spell</text><line x1="362.0" y1="242.0" x2="396.0" y2="242.0" stroke="#60869F" stroke-width="1.5"/><path d="M389.7,245.0 L396.0,242.0 L389.7,239.0" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="370.0" y="235.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">no</text><rect x="400.0" y="222.0" width="200.0" height="40.0" fill="#00131F" stroke="#043352" stroke-width="1" rx="8" stroke-dasharray="4 3"/><text x="500.0" y="246.0" fill="#60869F" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">no card (1 on 4 Nov)</text><line x1="190.0" y1="276.0" x2="190.0" y2="296.0" stroke="#60869F" stroke-width="1.5"/><path d="M187.0,289.7 L190.0,296.0 L193.0,289.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="198.0" y="290.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">yes</text><rect x="20.0" y="298.0" width="720.0" height="64.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="34.0" y="320.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">Recently bright and steady?</text><text x="34.0" y="339.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">In its 29 nights before: 12 or more clear nights, flare seen on 80% or more of them, median 3 MW or more;</text><text x="34.0" y="354.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">and 3 MW or more in the days just before the spell.</text><line x1="190.0" y1="364.0" x2="190.0" y2="384.0" stroke="#60869F" stroke-width="1.5"/><path d="M187.0,377.7 L190.0,384.0 L193.0,377.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="198.0" y="378.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">yes</text><line x1="570.0" y1="364.0" x2="570.0" y2="384.0" stroke="#60869F" stroke-width="1.5"/><path d="M567.0,377.7 L570.0,384.0 L573.0,377.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="578.0" y="378.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">no</text><rect x="20.0" y="386.0" width="340.0" height="82.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="34.0" y="408.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">Isolated and long enough?</text><text x="34.0" y="427.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Comparison flares within 10 km were measured</text><text x="34.0" y="442.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">and kept their heat, and the spell passes the</text><text x="34.0" y="458.7" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">High threshold (Figure 22)</text><rect x="400.0" y="386.0" width="340.0" height="82.0" fill="#001929" stroke="#043352" stroke-width="1" rx="9"/><text x="414.0" y="408.0" fill="#F9F6F3" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="650">Long, ongoing darkness?</text><text x="414.0" y="427.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Still dark, 28 or more clear dark nights,</text><text x="414.0" y="442.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">and seen on 12 or more earlier nights</text><line x1="100.0" y1="470.0" x2="100.0" y2="490.0" stroke="#60869F" stroke-width="1.5"/><path d="M97.0,483.7 L100.0,490.0 L103.0,483.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="108.0" y="484.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">yes</text><line x1="275.0" y1="470.0" x2="275.0" y2="490.0" stroke="#60869F" stroke-width="1.5"/><path d="M272.0,483.7 L275.0,490.0 L278.0,483.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="283.0" y="484.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">no</text><line x1="480.0" y1="470.0" x2="480.0" y2="490.0" stroke="#60869F" stroke-width="1.5"/><path d="M477.0,483.7 L480.0,490.0 L483.0,483.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="488.0" y="484.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">yes</text><line x1="655.0" y1="470.0" x2="655.0" y2="490.0" stroke="#60869F" stroke-width="1.5"/><path d="M652.0,483.7 L655.0,490.0 L658.0,483.7" stroke="#60869F" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="663.0" y="484.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">no</text><rect x="20.0" y="492.0" width="160.0" height="92.0" fill="#001929" stroke="#CA6202" stroke-width="1.6" rx="9"/><circle cx="40.0" cy="512.0" r="6" fill="#CA6202"/><text x="54.0" y="517.0" fill="#F9F6F3" font-size="14" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="700">High</text><text x="168.0" y="517.0" fill="#CA6202" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="end" font-weight="600">0 on 4 Nov</text><text x="34.0" y="539.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Strongest evidence;</text><text x="34.0" y="554.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">none yet</text><rect x="196.0" y="492.0" width="164.0" height="92.0" fill="#001929" stroke="#FEBD81" stroke-width="1.6" rx="9"/><circle cx="216.0" cy="512.0" r="6" fill="#FEBD81"/><text x="230.0" y="517.0" fill="#F9F6F3" font-size="14" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="700">Mid</text><text x="348.0" y="517.0" fill="#FEBD81" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="end" font-weight="600">2 on 4 Nov</text><text x="210.0" y="539.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Bright source; spell</text><text x="210.0" y="554.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">shorter, or not isolated</text><rect x="400.0" y="492.0" width="160.0" height="92.0" fill="#001929" stroke="#60869F" stroke-width="1.6" rx="9"/><circle cx="420.0" cy="512.0" r="6" fill="#60869F"/><text x="434.0" y="517.0" fill="#F9F6F3" font-size="14" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="700">Watch</text><text x="548.0" y="517.0" fill="#9CB7C9" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="end" font-weight="600">3 on 4 Nov</text><text x="414.0" y="539.0" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Smaller source,</text><text x="414.0" y="554.9" fill="#9CB7C9" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">long darkness</text><rect x="576.0" y="518.0" width="164.0" height="40.0" fill="#00131F" stroke="#043352" stroke-width="1" rx="8" stroke-dasharray="4 3"/><text x="658.0" y="542.0" fill="#60869F" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">no card</text><text x="20.0" y="610.0" fill="#60869F" font-size="11.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">On 4 Nov: 4582/4583: heat fell at a flare nearby; 927: no comparison flare in 10 km (Mid). Watch: 3644, 3662, 6011.</text></svg>
