<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="A flare fills a tiny fraction of one VIIRS pixel"><title>A flare fills a tiny fraction of one VIIRS pixel</title><rect width="760" height="440" rx="12" fill="#00131F"/><rect x="40.0" y="40.0" width="300.0" height="300.0" fill="#002640" stroke="#1D5072" stroke-width="1.2" rx="0"/><text x="40.0" y="28.0" fill="#9CB7C9" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">One nadir pixel, 750 m × 750 m</text><rect x="214.0" y="167.0" width="24.0" height="16.0" fill="#1D5072" rx="0"/><circle cx="239.0" cy="166.0" r="1.2" fill="#FEBD81"/><circle cx="239.0" cy="166.0" r="9" fill="none" stroke="#FEBD81" stroke-width="1"/><text x="190.0" y="362.0" fill="#60869F" font-size="12" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="400">drawn to scale: platform 60 × 40 m, flame 2 m²</text><path d="M248.0,166.0 L430.0,190.0" stroke="#60869F" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="430.0" y="60.0" width="260.0" height="260.0" fill="#001929" stroke="#043352" stroke-width="1" rx="8"/><text x="430.0" y="48.0" fill="#9CB7C9" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="600">Zoomed 40×: 26 m across</text><rect x="450.0" y="210.0" width="200.0" height="90.0" fill="#1D5072" rx="0"/><line x1="580.0" y1="210.0" x2="605.0" y2="152.0" stroke="#60869F" stroke-width="3"/><ellipse cx="608.0" cy="140.0" rx="7.2" ry="14.5" fill="#FEBD81"/><ellipse cx="608.0" cy="144.0" rx="3.6" ry="7.2" fill="#F7E5D4"/><text x="448.0" y="90.0" fill="#F9F6F3" font-size="12.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">Flame on the flare boom:</text><text x="448.0" y="106.9" fill="#F9F6F3" font-size="12.5" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">about 2 m² of 1,750 K gas</text><text x="448.0" y="308.0" fill="#60869F" font-size="11" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">deck</text><text x="40.0" y="398.0" fill="#9CB7C9" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">The flame covers about 1/270,000 of the pixel. VIIRS cannot see its shape; it records how much</text><text x="40.0" y="415.6" fill="#9CB7C9" font-size="13" font-family="'PP Neue Montreal', Roboto, Arial, sans-serif" text-anchor="start" font-weight="400">extra light the whole pixel gives off, and the method works back from that to temperature and size.</text></svg>
